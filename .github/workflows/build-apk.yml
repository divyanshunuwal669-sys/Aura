            private static String label(AccessibilityNodeInfo n) {
              if (n.isPassword()) return "[password field]";
              StringBuilder b = new StringBuilder();
              CharSequence t = n.getText();
              if (t != null) b.append(t).append(' ');
              CharSequence d = n.getContentDescription();
              if (d != null) b.append(d).append(' ');
              if (Build.VERSION.SDK_INT >= 26) {
                CharSequence h = n.getHintText();
                if (h != null) b.append(h);
              }
              String s = b.toString().trim().replaceAll("\\s+", " ");
              s = s.replaceAll("(?:\\d[ -]?){13,19}", "[card]").replaceAll("\\b\\d{4,8}\\b", "[num]");
              if (s.length() > 70) s = s.substring(0, 70);
              return s;
            }

            private static void walk(AccessibilityNodeInfo n, int depth, ArrayList<AccessibilityNodeInfo> nodes, StringBuilder sb) {
              if (n == null || depth > 28 || nodes.size() >= 110) return;
              if (n.isVisibleToUser()) {
                String lb = label(n);
                boolean c = n.isClickable();
                boolean e = n.isEditable();
                boolean s = n.isScrollable();
                if (lb.length() > 0 || e || s) {
                  StringBuilder fl = new StringBuilder();
                  if (c) fl.append('c');
                  if (e) fl.append('e');
                  if (s) fl.append('s');
                  if (n.isCheckable()) fl.append(n.isChecked() ? 'K' : 'k');
                  sb.append(nodes.size()).append('|').append(fl).append('|').append(lb).append('\n');
                  nodes.add(n);
                }
              }
              for (int i = 0; i < n.getChildCount(); i++) walk(n.getChild(i), depth + 1, nodes, sb);
            }

            private static String fullInfo(AccessibilityNodeInfo n) {
              StringBuilder b = new StringBuilder();
              AccessibilityNodeInfo p = n;
              int g = 0;
              while (p != null && g < 3) {
                CharSequence t = p.getText();
                CharSequence d = p.getContentDescription();
                if (t != null) b.append(t).append(' ');
                if (d != null) b.append(d).append(' ');
                p = p.getParent();
                g++;
              }
              return b.toString().toLowerCase();
            }

            private static boolean clickNode(AccessibilityNodeInfo n) {
              AccessibilityNodeInfo t = n;
              int g = 0;
              while (t != null && !t.isClickable() && g < 5) { t = t.getParent(); g++; }
              return t != null && t.performAction(AccessibilityNodeInfo.ACTION_CLICK);
            }

            private static AccessibilityNodeInfo firstScrollable(AccessibilityNodeInfo n, int depth) {
              if (n == null || depth > 30) return null;
              if (n.isScrollable()) return n;
              for (int i = 0; i < n.getChildCount(); i++) {
                AccessibilityNodeInfo r = firstScrollable(n.getChild(i), depth + 1);
                if (r != null) return r;
              }
              return null;
            }

            // 1 ok, 0 failed, -1 blocked (payment/delete)
            private static int exec(Context ctx, SendService svc, JSONObject a, ArrayList<AccessibilityNodeInfo> nodes) {
              String act = a.optString("action", "");
              int id = a.optInt("id", -1);
              boolean idOk = id >= 0 && id < nodes.size();
              if ("click".equals(act)) {
                if (!idOk) return 0;
                AccessibilityNodeInfo n = nodes.get(id);
                String t = fullInfo(n);
                for (String b : BLOCK_TXT) if (t.contains(b)) return -1;
                return clickNode(n) ? 1 : 0;
              }
              if ("type".equals(act)) {
                if (!idOk) return 0;
                AccessibilityNodeInfo n = nodes.get(id);
                if (n.isPassword()) return -1;
                n.performAction(AccessibilityNodeInfo.ACTION_FOCUS);
                Bundle b = new Bundle();
                b.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, a.optString("text", ""));
                return n.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, b) ? 1 : 0;
              }
              if ("enter".equals(act)) {
                if (Build.VERSION.SDK_INT < 30) return 0;
                AccessibilityNodeInfo n = idOk ? nodes.get(id) : null;
                if (n == null) {
                  AccessibilityNodeInfo root = svc.getRootInActiveWindow();
                  if (root != null) n = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT);
                }
                if (n == null) return 0;
                return n.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.getId()) ? 1 : 0;
              }
              if ("scroll".equals(act)) {
                AccessibilityNodeInfo n = idOk ? nodes.get(id) : firstScrollable(svc.getRootInActiveWindow(), 0);
                if (n == null) return 0;
                boolean down = !"up".equals(a.optString("dir", "down"));
                return n.performAction(down ? AccessibilityNodeInfo.ACTION_SCROLL_FORWARD : AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD) ? 1 : 0;
              }
              if ("back".equals(act)) return svc.global("back") ? 1 : 0;
              if ("home".equals(act)) return svc.global("home") ? 1 : 0;
              if ("wait".equals(act)) { nap(1500); return 1; }
              if ("open".equals(act)) return openByName(ctx, a.optString("app", "")) ? 1 : 0;
              return 0;
            }

            private static String norm(String s) {
              return s == null ? "" : s.toLowerCase().replaceAll("[^\\p{L}\\p{M}\\p{N}]", "");
            }

            private static boolean openByName(Context ctx, String name) {
              try {
                String q = norm(name);
                if (q.length() == 0) return false;
                PackageManager pm = ctx.getPackageManager();
                Intent main = new Intent(Intent.ACTION_MAIN, null);
                main.addCategory(Intent.CATEGORY_LAUNCHER);
                List<ResolveInfo> list = pm.queryIntentActivities(main, 0);
                String best = null;
                int bs = 0;
                for (ResolveInfo ri : list) {
                  String ln = norm(ri.loadLabel(pm).toString());
                  int sc = 0;
                  if (ln.equals(q)) sc = 100;
                  else if (ln.startsWith(q)) sc = 80;
                  else if (ln.contains(q)) sc = 60;
                  else if (ln.length() > 3 && q.contains(ln)) sc = 50;
                  if (sc > bs) { bs = sc; best = ri.activityInfo.packageName; }
                }
                if (best == null || blockedPkg(best)) return false;
                Intent i = pm.getLaunchIntentForPackage(best);
                if (i == null) return false;
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                ctx.startActivity(i);
                return true;
              } catch (Throwable t) {
                return false;
              }
            }

            // ---------- AI ----------
            private static final String SYS = "You control an Android phone through its accessibility tree. Reply with ONE JSON object and nothing else: "
              + "{\"action\":\"click|type|enter|scroll|back|home|open|wait|done|fail\",\"id\":<element id>,\"text\":\"<text to type>\",\"dir\":\"down|up\",\"app\":\"<app name for open>\",\"say\":\"very short Hinglish status\"}. "
              + "Choose the single next best action. Screen elements are listed as id|flags|label (c=clickable e=editable s=scrollable k=checkbox). "
              + "Use open to launch an app by name. After typing into a search box use enter. "
              + "Never make payments, purchases or transfers and never delete or uninstall anything; if the goal needs that, reply fail. Never type passwords. "
              + "When the goal is achieved reply done. If you are stuck after several tries reply fail.";

            private static String askAi(SharedPreferences sp, String goal, String pkg, String screen, ArrayList<String> hist) {
              String user = "GOAL: " + goal + "\nCURRENT APP: " + pkg + "\nRECENT ACTIONS: " + hist.toString() + "\nSCREEN:\n" + screen;
              String qk = sp.getString("qk", "");
              String gk = sp.getString("gk", "");
              String out = null;
              if (qk.length() > 5) out = groq(qk, user);
              if (out == null && gk.length() > 5) out = gemini(gk, user);
              return out;
            }

            private static String post(String url, String[][] headers, String body) {
              HttpURLConnection c = null;
              try {
                c = (HttpURLConnection) new URL(url).openConnection();
                c.setConnectTimeout(10000);
                c.setReadTimeout(25000);
                c.setRequestMethod("POST");
                c.setDoOutput(true);
                c.setRequestProperty("Content-Type", "application/json");
                for (String[] hd : headers) c.setRequestProperty(hd[0], hd[1]);
                OutputStream os = c.getOutputStream();
                os.write(body.getBytes("UTF-8"));
                os.close();
                if (c.getResponseCode() != 200) return null;
                InputStream is = c.getInputStream();
                BufferedReader br = new BufferedReader(new InputStreamReader(is, "UTF-8"));
                StringBuilder sb = new StringBuilder();
                String line;
                while ((line = br.readLine()) != null) sb.append(line);
                br.close();
                return sb.toString();
              } catch (Throwable t) {
                return null;
              } finally {
                if (c != null) c.disconnect();
              }
            }

            private static String groq(String key, String user) {
              try {
                JSONArray msgs = new JSONArray();
                msgs.put(new JSONObject().put("role", "system").put("content", SYS));
                msgs.put(new JSONObject().put("role", "user").put("content", user));
                JSONObject body = new JSONObject();
                body.put("model", "llama-3.3-70b-versatile");
                body.put("messages", msgs);
                body.put("max_tokens", 200);
                body.put("temperature", 0.2);
                body.put("response_format", new JSONObject().put("type", "json_object"));
                String r = post("https://api.groq.com/openai/v1/chat/completions", new String[][] { { "Authorization", "Bearer " + key } }, body.toString());
                if (r == null) return null;
                return new JSONObject(r).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content");
              } catch (Throwable t) {
                return null;
              }
            }

            private static String gemini(String key, String user) {
              try {
                JSONObject body = new JSONObject();
                body.put("system_instruction", new JSONObject().put("parts", new JSONArray().put(new JSONObject().put("text", SYS))));
                body.put("contents", new JSONArray().put(new JSONObject().put("role", "user").put("parts", new JSONArray().put(new JSONObject().put("text", user)))));
                body.put("generationConfig", new JSONObject().put("responseMimeType", "application/json").put("temperature", 0.2));
                String[] models = new String[] { "gemini-flash-lite-latest", "gemini-flash-latest" };
                for (String m : models) {
                  String r = post("https://generativelanguage.googleapis.com/v1beta/models/" + m + ":generateContent", new String[][] { { "x-goog-api-key", key } }, body.toString());
                  if (r == null) continue;
                  JSONArray parts = new JSONObject(r).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts");
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < parts.length(); i++) sb.append(parts.getJSONObject(i).optString("text", ""));
                  if (sb.length() > 0) return sb.toString();
                }
                return null;
              } catch (Throwable t) {
                return null;
              }
            }

            private static JSONObject parse(String r) {
              try {
                int a = r.indexOf('{');
                int b = r.lastIndexOf('}');
                if (a < 0 || b < a) return null;
                return new JSONObject(r.substring(a, b + 1));
              } catch (Throwable t) {
                return null;
              }
            }

            // ---------- notification + voice ----------
            private static void note(Context ctx, String title, String text, boolean ongoing) {
              try {
                NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                if (Build.VERSION.SDK_INT >= 26) {
                  nm.createNotificationChannel(new NotificationChannel(CH, "Aura kaam", NotificationManager.IMPORTANCE_LOW));
                }
                Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(ctx, CH) : new Notification.Builder(ctx);
                b.setContentTitle(title);
                b.setContentText(text);
                b.setSmallIcon(android.R.drawable.ic_menu_manage);
                b.setOngoing(ongoing);
                if (ongoing) {
                  Intent st = new Intent("aura.AGENT_STOP");
                  st.setPackage(ctx.getPackageName());
                  PendingIntent pi = PendingIntent.getBroadcast(ctx, 5, st, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  b.addAction(android.R.drawable.ic_menu_close_clear_cancel, "Roko", pi);
                }
                nm.notify(78, b.build());
              } catch (Throwable t) { }
            }

            private static void finish(final Context ctx, final String msg) {
              note(ctx, "Aura", msg, false);
              new Handler(Looper.getMainLooper()).post(new Runnable() {
                public void run() {
                  try {
                    final TextToSpeech[] box = new TextToSpeech[1];
                    box[0] = new TextToSpeech(ctx.getApplicationContext(), new TextToSpeech.OnInitListener() {
                      public void onInit(int status) {
                        try {
                          if (status == TextToSpeech.SUCCESS && box[0] != null) {
                            box[0].setLanguage(new Locale("en", "IN"));
                            box[0].speak(msg, TextToSpeech.QUEUE_FLUSH, new Bundle(), "agent");
                          }
                        } catch (Throwable t) { }
                      }
                    });
                    new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                      public void run() {
                        try { if (box[0] != null) box[0].shutdown(); } catch (Throwable t) { }
                      }
                    }, 9000);
                  } catch (Throwable t) { }
                }
              });
            }
          }
