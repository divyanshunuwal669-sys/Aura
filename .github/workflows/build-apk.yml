            // ---------- AI answer ----------
            private void askAi(final String text) {
              final String qk = sp().getString("qk", "");
              final String gk = sp().getString("gk", "");
              final String sys = buildSys();
              final ArrayList<String> hcopy = new ArrayList<String>(hist);
              new Thread(new Runnable() {
                public void run() {
                  String ans = null;
                  if (qk.length() > 5) ans = callGroq(qk, sys, hcopy, text);
                  if ((ans == null || ans.length() == 0) && gk.length() > 5) ans = callGemini(gk, sys, hcopy, text);
                  final String out = clean(ans);
                  h.post(new Runnable() {
                    public void run() {
                      if (!session) return;
                      if (out.length() == 0) {
                        speak("Abhi jawab nahi mil paya. Dobara Hey Aura bolo.", false);
                      } else {
                        hist.add(text);
                        hist.add(out);
                        while (hist.size() > 8) hist.remove(0);
                        speak(out, true);
                      }
                    }
                  });
                }
              }).start();
            }

