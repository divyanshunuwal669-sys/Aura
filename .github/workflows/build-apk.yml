            private String[] toggleCmd(String n) {
              boolean on = n.matches(".*\\b(on|chalu|shuru|enable|start)\\b.*") || n.contains("\u091a\u093e\u0932\u0942") || n.contains("\u0911\u0928");
              boolean off = n.matches(".*\\b(off|band|bandh|disable|stop)\\b.*") || n.contains("\u092c\u0902\u0926") || n.contains("\u0911\u092b");
              if (on == off) return null;
              if (n.split(" ").length > 5) return null;
              String[] keys = new String[] { "wifi", "bluetooth", "airplane", "location", "nfc", "data" };
              for (int i = 0; i < SET_KEYS.length; i++) {
                String[] row = SET_KEYS[i];
                boolean tk = false;
                for (int x = 0; x < keys.length; x++) if (keys[x].equals(row[0])) tk = true;
                if (!tk) continue;
                for (int j = 1; j < row.length; j++) {
                  if (n.contains(row[j])) return new String[] { row[0], on ? "on" : "off" };
                }
              }
              return null;
            }

