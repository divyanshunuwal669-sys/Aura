            private String songQuery(String n) {
              String[] pats = new String[] {
                "(?:aura )?play (.{2,})",
                "(?:aura )?(.{2,}?) (?:gana|song|music) (?:play|bajao|chalao|laga|lagao)(?: kar(?:o)?| do)?",
                "(?:aura )?(.{2,}?) (?:play kar(?:o)?|play kar do|bajao|bajana)"
              };
              for (String p : pats) {
