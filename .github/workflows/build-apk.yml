name: Build Aura APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon.svg www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications @capacitor/app-launcher @capacitor-community/speech-recognition @capacitor-community/text-to-speech @capawesome/capacitor-volume @capawesome/capacitor-torch @capgo/capacitor-brightness --legacy-peer-deps
          npx cap init Aura com.divyanshu.aura --web-dir=www
          npx cap add android
          D=android/app/src/main/java/com/divyanshu/aura
          R=android/app/src/main/res
          mkdir -p $D $R/xml $R/values
          cat > $D/AuraNativePlugin.java << 'EOF'
          package com.divyanshu.aura;

          import android.app.Activity;
          import android.app.SearchManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.view.KeyEvent;
          import android.view.WindowManager;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.List;

          @CapacitorPlugin(name = "AuraNative")
          public class AuraNativePlugin extends Plugin {
            private static final String WS = "com.divyanshu.aura.WakeService";

            @Override
            public void load() {
              try {
                Intent i = getActivity().getIntent();
                if (i != null && (i.getBooleanExtra("aura_wake", false) || "aura.WAKE".equals(i.getAction()))) {
                  i.removeExtra("aura_wake");
                  i.setAction(Intent.ACTION_MAIN);
                  lockShow(true);
                  notifyListeners("wake", new JSObject(), true);
                }
              } catch (Throwable t) { }
            }

            @Override
            protected void handleOnNewIntent(Intent intent) {
              super.handleOnNewIntent(intent);
              try {
                if (intent != null && (intent.getBooleanExtra("aura_wake", false) || "aura.WAKE".equals(intent.getAction()))) {
                  intent.removeExtra("aura_wake");
                  lockShow(true);
                  notifyListeners("wake", new JSObject(), true);
                }
              } catch (Throwable t) { }
            }

            @Override
            protected void handleOnResume() {
              super.handleOnResume();
              wakeAction("FG");
            }

            @Override
            protected void handleOnPause() {
              super.handleOnPause();
              lockShow(false);
              wakeAction("BG");
            }


            private void lockShow(final boolean on) {
              try {
                final Activity a = getActivity();
                a.runOnUiThread(new Runnable() {
                  public void run() {
                    try {
                      if (Build.VERSION.SDK_INT >= 27) {
                        a.setShowWhenLocked(on);
                        a.setTurnScreenOn(on);
                      } else {
                        int f = WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON;
                        if (on) a.getWindow().addFlags(f); else a.getWindow().clearFlags(f);
                      }
                    } catch (Throwable t) { }
                  }
                });
              } catch (Throwable t) { }
            }

            private void wakeAction(String a) {
              try {
                Context c = getContext();
                if (!c.getSharedPreferences("aura", Context.MODE_PRIVATE).getBoolean("wake", false)) return;
                Intent i = new Intent(c, Class.forName(WS));
                i.setAction(a);
                c.startService(i);
              } catch (Throwable t) { }
            }

            @PluginMethod
            public void launch(PluginCall call) {
              String pkg = call.getString("package");
              if (pkg == null) { call.reject("package missing"); return; }
              Intent i = getContext().getPackageManager().getLaunchIntentForPackage(pkg);
              if (i == null) { call.reject("app launch nahi ho sakta"); return; }
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              getContext().startActivity(i);
              call.resolve();
            }

            @PluginMethod
            public void listApps(PluginCall call) {
              PackageManager pm = getContext().getPackageManager();
              Intent main = new Intent(Intent.ACTION_MAIN, null);
              main.addCategory(Intent.CATEGORY_LAUNCHER);
              List<ResolveInfo> list = pm.queryIntentActivities(main, 0);
              JSArray arr = new JSArray();
              for (ResolveInfo ri : list) {
                JSObject o = new JSObject();
                o.put("name", ri.loadLabel(pm).toString());
                o.put("package", ri.activityInfo.packageName);
                arr.put(o);
              }
              JSObject r = new JSObject();
              r.put("apps", arr);
              call.resolve(r);
            }

            @PluginMethod
            public void deviceStats(PluginCall call) {
              try {
                Class<?> c = Class.forName("com.divyanshu.aura.HudNative");
                String r = (String) c.getMethod("stats", Context.class).invoke(null, getContext());
                call.resolve(new JSObject(r));
              } catch (Throwable t) {
                call.reject("stats unavailable");
              }
            }

            @PluginMethod
            public void edgeTts(final PluginCall call) {
              final String tx = call.getString("text", "");
              final String vo = call.getString("voice", "");
              final boolean gfv = Boolean.TRUE.equals(call.getBoolean("gf", false));
              new Thread(new Runnable() {
                public void run() {
                  byte[] r = EdgeTts.synth(tx, vo, gfv);
                  if (r == null) { call.reject("edge fail"); return; }
                  JSObject o = new JSObject();
                  o.put("pcm", android.util.Base64.encodeToString(r, android.util.Base64.NO_WRAP));
                  call.resolve(o);
                }
              }).start();
            }

            @PluginMethod
            public void appIcon(PluginCall call) {
              try {
                Class<?> c = Class.forName("com.divyanshu.aura.HudNative");
                String r = (String) c.getMethod("icon", Context.class, String.class).invoke(null, getContext(), call.getString("pkg", ""));
                JSObject o = new JSObject();
                o.put("png", r);
                call.resolve(o);
              } catch (Throwable t) {
                call.reject("icon unavailable");
              }
            }

            @PluginMethod
            public void media(PluginCall call) {
              String k = call.getString("key", "");
              int code;
              if ("play".equals(k)) code = KeyEvent.KEYCODE_MEDIA_PLAY;
              else if ("pause".equals(k)) code = KeyEvent.KEYCODE_MEDIA_PAUSE;
              else if ("toggle".equals(k)) code = KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE;
              else if ("next".equals(k)) code = KeyEvent.KEYCODE_MEDIA_NEXT;
              else if ("prev".equals(k)) code = KeyEvent.KEYCODE_MEDIA_PREVIOUS;
              else if ("stop".equals(k)) code = KeyEvent.KEYCODE_MEDIA_STOP;
              else { call.reject("unknown key"); return; }
              try {
                AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, code));
                am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, code));
                call.resolve();
              } catch (Throwable t) {
                call.reject("media key nahi gaya: " + t.getMessage());
              }
            }

            @PluginMethod
            public void wakeStart(PluginCall call) {
              try {
                Context c = getContext();
                boolean force = call.getBoolean("force", false);
                boolean canOverlay = Build.VERSION.SDK_INT < 23 || Settings.canDrawOverlays(c);
                if (!canOverlay && !force) {
                  JSObject r = new JSObject();
                  r.put("overlay", false);
                  call.resolve(r);
                  return;
                }
                JSArray arr = call.getArray("phrases");
                StringBuilder sb = new StringBuilder();
                if (arr != null) {
                  for (int k = 0; k < arr.length(); k++) {
                    if (k > 0) sb.append("|");
                    sb.append(arr.getString(k));
                  }
                }
                c.getSharedPreferences("aura", Context.MODE_PRIVATE).edit()
                  .putString("phrases", sb.toString()).putBoolean("wake", true).apply();
                Intent i = new Intent(c, Class.forName(WS));
                i.setAction("START");
                if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(i); else c.startService(i);
                wakeAction("FG");
                JSObject r = new JSObject();
                r.put("overlay", canOverlay);
                r.put("started", true);
                call.resolve(r);
              } catch (ClassNotFoundException e) {
                call.reject("Hey Aura module is build mein nahi hai");
              } catch (Throwable t) {
                call.reject("Hey Aura start nahi hua: " + t.getMessage());
              }
            }

            @PluginMethod
            public void wakeStop(PluginCall call) {
              try {
                Context c = getContext();
                c.getSharedPreferences("aura", Context.MODE_PRIVATE).edit().putBoolean("wake", false).apply();
                Intent i = new Intent(c, Class.forName(WS));
                i.setAction("STOP");
                c.startService(i);
              } catch (Throwable t) { }
              call.resolve();
            }

            @PluginMethod
            public void wakeOverlaySettings(PluginCall call) {
              try {
                Intent i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                  Uri.parse("package:" + getContext().getPackageName()));
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(i);
              } catch (Throwable t) { }
              call.resolve();
            }

            @PluginMethod
            public void view(PluginCall call) {
              String url = call.getString("url");
              if (url == null || url.length() == 0) { call.reject("url missing"); return; }
              String pkg = call.getString("package");
              try {
                Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                if (pkg != null && pkg.length() > 0) i.setPackage(pkg);
                try {
                  getContext().startActivity(i);
                } catch (Throwable e1) {
                  if (pkg == null || pkg.length() == 0) throw e1;
                  i.setPackage(null);
                  getContext().startActivity(i);
                }
                call.resolve();
              } catch (Throwable t) {
                call.reject("link khul nahi paya: " + t.getMessage());
              }
            }

            @PluginMethod
            public void bringFront(PluginCall call) {
              try {
                Context c = getContext();
                Intent i = c.getPackageManager().getLaunchIntentForPackage(c.getPackageName());
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                c.startActivity(i);
                call.resolve();
              } catch (Throwable t) {
                call.reject("Aura aage nahi aa payi: " + t.getMessage());
              }
            }

            @PluginMethod
            public void playSearch(PluginCall call) {
              String q = call.getString("query");
              if (q == null || q.trim().length() == 0) { call.reject("query missing"); return; }
              Context c = getContext();
              String[] pk = new String[] { "com.google.android.apps.youtube.music", "com.spotify.music" };
              for (String p : pk) {
                try {
                  Intent i = new Intent(MediaStore.INTENT_ACTION_MEDIA_PLAY_FROM_SEARCH);
                  i.setPackage(p);
                  i.putExtra(MediaStore.EXTRA_MEDIA_FOCUS, "vnd.android.cursor.item/*");
                  i.putExtra(SearchManager.QUERY, q);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  if (i.resolveActivity(c.getPackageManager()) != null) {
                    c.startActivity(i);
                    JSObject r = new JSObject();
                    r.put("played", true);
                    r.put("app", p);
                    call.resolve(r);
                    return;
                  }
                } catch (Throwable t) { }
              }
              try {
                c.getSharedPreferences("aura", Context.MODE_PRIVATE).edit().putLong("play_until", System.currentTimeMillis() + 25000).apply();
                Intent v = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/results?search_query=" + Uri.encode(q)));
                v.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                  v.setPackage("com.google.android.youtube");
                  c.startActivity(v);
                } catch (Throwable e2) {
                  v.setPackage(null);
                  c.startActivity(v);
                }
                JSObject r = new JSObject();
                r.put("played", false);
                call.resolve(r);
              } catch (Throwable t) {
                call.reject("gana nahi khul paya: " + t.getMessage());
              }
            }

            @PluginMethod
            public void armSend(PluginCall call) {
              String t = call.getString("text", "");
              getContext().getSharedPreferences("aura", Context.MODE_PRIVATE).edit()
                .putString("send_text", t).putLong("send_until", System.currentTimeMillis() + 25000).apply();
              call.resolve();
            }

            @PluginMethod
            public void accessStatus(PluginCall call) {
              boolean on = false;
              try {
                String s = Settings.Secure.getString(getContext().getContentResolver(), Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                on = s != null && s.contains(getContext().getPackageName()) && s.contains("SendService");
              } catch (Throwable t) { }
              JSObject r = new JSObject();
              r.put("enabled", on);
              call.resolve(r);
            }

            @PluginMethod
            public void accessSettings(PluginCall call) {
              try {
                Intent i = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(i);
              } catch (Throwable t) { }
              call.resolve();
            }

            @PluginMethod
            public void batterySettings(PluginCall call) {
              try {
                Intent i = new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(i);
              } catch (Throwable t) { }
              call.resolve();
            }

            @PluginMethod
            public void setBrain(PluginCall call) {
              android.content.SharedPreferences.Editor e = getContext().getSharedPreferences("aura", Context.MODE_PRIVATE).edit();
              String[] ks = new String[] { "gk", "ek", "ev", "smk", "smv", "smn", "gfm", "edv", "qk", "dev", "uname", "rules", "autoc" };
              for (String k : ks) e.putString(k, call.getString(k, ""));
              e.putBoolean("bg", call.getBoolean("bg", true));
              e.apply();
              call.resolve();
            }

            private static String settingsAction(String k) {
              if ("wifi".equals(k)) return "android.settings.WIFI_SETTINGS";
              if ("bluetooth".equals(k)) return "android.settings.BLUETOOTH_SETTINGS";
              if ("display".equals(k)) return "android.settings.DISPLAY_SETTINGS";
              if ("sound".equals(k)) return "android.settings.SOUND_SETTINGS";
              if ("battery".equals(k)) return "android.intent.action.POWER_USAGE_SUMMARY";
              if ("location".equals(k)) return "android.settings.LOCATION_SOURCE_SETTINGS";
              if ("airplane".equals(k)) return "android.settings.AIRPLANE_MODE_SETTINGS";
              if ("data".equals(k)) return "android.settings.DATA_ROAMING_SETTINGS";
              if ("apps".equals(k)) return "android.settings.APPLICATION_SETTINGS";
              if ("storage".equals(k)) return "android.settings.INTERNAL_STORAGE_SETTINGS";
              if ("security".equals(k)) return "android.settings.SECURITY_SETTINGS";
              if ("accessibility".equals(k)) return "android.settings.ACCESSIBILITY_SETTINGS";
              if ("developer".equals(k)) return "android.settings.APPLICATION_DEVELOPMENT_SETTINGS";
              if ("date".equals(k)) return "android.settings.DATE_SETTINGS";
              if ("language".equals(k)) return "android.settings.LOCALE_SETTINGS";
              if ("nfc".equals(k)) return "android.settings.NFC_SETTINGS";
              if ("vpn".equals(k)) return "android.settings.VPN_SETTINGS";
              if ("privacy".equals(k)) return "android.settings.PRIVACY_SETTINGS";
              if ("about".equals(k)) return "android.settings.DEVICE_INFO_SETTINGS";
              if ("cast".equals(k)) return "android.settings.CAST_SETTINGS";
              if ("keyboard".equals(k)) return "android.settings.INPUT_METHOD_SETTINGS";
              if ("hotspot".equals(k)) return "android.settings.WIRELESS_SETTINGS";
              return "android.settings.SETTINGS";
            }

            private static String toggleKw(String k) {
              if ("wifi".equals(k)) return "wi-fi|wifi|wi fi";
              if ("bluetooth".equals(k)) return "bluetooth";
              if ("airplane".equals(k)) return "airplane|flight";
              if ("location".equals(k)) return "location";
              if ("nfc".equals(k)) return "nfc";
              if ("data".equals(k)) return "mobile data";
              return k;
            }

            // pages that need an exact screen. Tries each candidate; returns false when this phone has none.
            private boolean deepOpen(String k) {
              java.util.ArrayList<Intent> L = new java.util.ArrayList<Intent>();
              if ("tts".equals(k)) {
                L.add(new Intent("com.android.settings.TTS_SETTINGS"));
                L.add(new Intent().setClassName("com.android.settings", "com.android.settings.Settings$TextToSpeechSettingsActivity"));
              } else if ("voiceinput".equals(k)) {
                L.add(new Intent("android.settings.VOICE_INPUT_SETTINGS"));
              } else if ("wallpaper".equals(k)) {
                L.add(new Intent("android.intent.action.SET_WALLPAPER"));
              } else if ("defaultapps".equals(k)) {
                L.add(new Intent("android.settings.MANAGE_DEFAULT_APPS_SETTINGS"));
              } else if ("datausage".equals(k)) {
                L.add(new Intent("android.settings.DATA_USAGE_SETTINGS"));
              }
              for (Intent i : L) {
                try {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getContext().startActivity(i);
                  return true;
                } catch (Throwable e) { }
              }
              return false;
            }

            @PluginMethod
            public void openSettings(PluginCall call) {
              String k = call.getString("page", "main");
              String state = call.getString("state", "");
              Context c = getContext();
              if ("tts".equals(k) || "voiceinput".equals(k) || "wallpaper".equals(k) || "defaultapps".equals(k) || "datausage".equals(k)) {
                if (deepOpen(k)) call.resolve(); else call.reject("nodirect");
                return;
              }
              if (state.length() > 0) {
                c.getSharedPreferences("aura", Context.MODE_PRIVATE).edit()
                  .putString("auto_pkg", "com.android.settings")
                  .putString("auto_mode", "toggle")
                  .putString("auto_q", toggleKw(k))
                  .putString("auto_msg", state)
                  .putInt("auto_stage", 0)
                  .putInt("auto_tries", 0)
                  .putLong("auto_until", System.currentTimeMillis() + 20000).apply();
              }
              try {
                Intent i = new Intent(settingsAction(k));
                if ("hotspot".equals(k)) i.setClassName("com.android.settings", "com.android.settings.TetherSettings");
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                  c.startActivity(i);
                } catch (Throwable e1) {
                  Intent f = new Intent(settingsAction("hotspot".equals(k) ? "hotspot" : k));
                  f.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                    c.startActivity(f);
                  } catch (Throwable e2) {
                    Intent g = new Intent("android.settings.SETTINGS");
                    g.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                    c.startActivity(g);
                  }
                }
                call.resolve();
              } catch (Throwable t) {
                call.reject("settings nahi khuli: " + t.getMessage());
              }
            }

            @PluginMethod
            public void autoRun(PluginCall call) {
              String pkg = call.getString("package");
              if (pkg == null || pkg.length() == 0) { call.reject("package missing"); return; }
              String lp = pkg.toLowerCase();
              String[] bl = new String[] { "paisa", "phonepe", "paytm", "bhim", "upi", "bank", "wallet", "razorpay", "cred.club", "payment", "pay" };
              for (String b : bl) {
                if (lp.contains(b)) { call.reject("Payment ya bank app mein Aura kuch nahi karti."); return; }
              }
              Context c = getContext();
              Intent i = c.getPackageManager().getLaunchIntentForPackage(pkg);
              if (i == null) { call.reject("app launch nahi ho sakta"); return; }
              c.getSharedPreferences("aura", Context.MODE_PRIVATE).edit()
                .putString("auto_pkg", pkg)
                .putString("auto_mode", call.getString("mode", "search"))
                .putString("auto_q", call.getString("q", ""))
                .putString("auto_msg", call.getString("msg", ""))
                .putInt("auto_stage", 0)
                .putInt("auto_tries", 0)
                .putLong("auto_until", System.currentTimeMillis() + 45000).apply();
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              c.startActivity(i);
              call.resolve();
            }

            private Object svcInstance() {
              try {
                Class<?> c = Class.forName("com.divyanshu.aura.SendService");
                return c.getField("INSTANCE").get(null);
              } catch (Throwable t) {
                return null;
              }
            }

            private boolean svcCall(String name, Class<?>[] types, Object[] args) {
              Object s = svcInstance();
              if (s == null) return false;
              try {
                Object r = s.getClass().getMethod(name, types).invoke(s, args);
                return !(r instanceof Boolean) || ((Boolean) r).booleanValue();
              } catch (Throwable t) {
                return false;
              }
            }

            private void okResult(PluginCall call, boolean ok) {
              JSObject r = new JSObject();
              r.put("ok", ok);
              call.resolve(r);
            }

            @PluginMethod
            public void globalAction(PluginCall call) {
              boolean ok = svcCall("global", new Class<?>[] { String.class }, new Object[] { call.getString("name", "") });
              okResult(call, ok);
            }

            @PluginMethod
            public void scrollScreen(PluginCall call) {
              boolean ok = svcCall("scrollScreen", new Class<?>[] { boolean.class }, new Object[] { Boolean.valueOf(call.getBoolean("down", true)) });
              okResult(call, ok);
            }

            @PluginMethod
            public void clickText(PluginCall call) {
              boolean ok = svcCall("clickText", new Class<?>[] { String.class }, new Object[] { call.getString("text", "") });
              okResult(call, ok);
            }

            @PluginMethod
            public void typeText(PluginCall call) {
              boolean ok = svcCall("typeText", new Class<?>[] { String.class }, new Object[] { call.getString("text", "") });
              okResult(call, ok);
            }

            @PluginMethod
            public void imeEnter(PluginCall call) {
              boolean ok = svcCall("imeEnter", new Class<?>[] {}, new Object[] {});
              okResult(call, ok);
            }

            @PluginMethod
            public void setAgent(PluginCall call) {
              getContext().getSharedPreferences("aura", Context.MODE_PRIVATE).edit()
                .putBoolean("agent_ok", call.getBoolean("on", false)).apply();
              call.resolve();
            }

            @PluginMethod
            public void agentStart(PluginCall call) {
              String goal = call.getString("goal", "");
              JSObject r = new JSObject();
              if (goal.trim().length() < 3) { r.put("msg", "Kaam samajh nahi aaya."); call.resolve(r); return; }
              try {
                Class<?> c = Class.forName("com.divyanshu.aura.AgentCore");
                Object res = c.getMethod("start", Context.class, String.class).invoke(null, getContext(), goal);
                r.put("msg", res == null ? "" : res.toString());
              } catch (ClassNotFoundException e) {
                r.put("msg", "Screen-control module is build mein nahi hai.");
              } catch (Throwable t) {
                r.put("msg", "Kaam shuru nahi hua: " + t.getMessage());
              }
              call.resolve(r);
            }

            @PluginMethod
            public void agentStop(PluginCall call) {
              try {
                Class<?> c = Class.forName("com.divyanshu.aura.AgentCore");
                c.getMethod("stop").invoke(null);
              } catch (Throwable t) { }
              call.resolve();
            }
          }
          EOF
          cat > $D/MainActivity.java << 'EOF'
          package com.divyanshu.aura;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(AuraNativePlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
          cat > $D/WakeService.java << 'EOF'
          package com.divyanshu.aura;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.SearchManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.content.pm.ServiceInfo;
