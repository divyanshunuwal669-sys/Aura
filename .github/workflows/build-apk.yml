          cat > $D/SendService.java << 'EOF'
          package com.divyanshu.aura;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          public class SendService extends AccessibilityService {
            private long lastTry = 0;
            private static final String YT = "com.google.android.youtube";
            private static final String[] MSG = new String[] { "com.whatsapp", "com.whatsapp.w4b", "com.google.android.apps.messaging", "com.samsung.android.messaging", "com.android.mms" };
            private static final String[] BLOCK = new String[] { "paisa", "phonepe", "paytm", "bhim", "upi", "bank", "wallet", "razorpay", "cred.club", "payment", "pay" };

            @Override
            public void onInterrupt() { }

            private static boolean blocked(String pkg) {
              String p = pkg.toLowerCase();
              for (String b : BLOCK) if (p.contains(b)) return true;
              return false;
            }

            private static boolean isMsgApp(String pkg) {
              for (String m : MSG) if (m.equals(pkg)) return true;
              return false;
            }

            @Override
            public void onAccessibilityEvent(AccessibilityEvent e) {
              try {
                SharedPreferences sp = getSharedPreferences("aura", Context.MODE_PRIVATE);
                long until = sp.getLong("send_until", 0);
                long pu = sp.getLong("play_until", 0);
                long au = sp.getLong("auto_until", 0);
                if (until == 0 && pu == 0 && au == 0) return;
                long now = System.currentTimeMillis();
                if (pu != 0 && now > pu) { sp.edit().putLong("play_until", 0).apply(); pu = 0; }
                if (until != 0 && now > until) { sp.edit().putLong("send_until", 0).putString("send_text", "").apply(); until = 0; }
                if (au != 0 && now > au) { sp.edit().putLong("auto_until", 0).apply(); au = 0; }
                if (until == 0 && pu == 0 && au == 0) return;
                if (now - lastTry < 350) return;
                lastTry = now;
                CharSequence pkc = e.getPackageName();
                if (pkc == null) return;
                String pkg = pkc.toString();
                if (pkg.equals(getPackageName())) return;
                AccessibilityNodeInfo root = getRootInActiveWindow();
                if (root == null) return;

                if (au != 0 && pkg.equals(sp.getString("auto_pkg", "")) && !blocked(pkg)) {
                  auto(sp, root);
                  return;
                }
                if (pu != 0 && pkg.equals(YT)) {
                  AccessibilityNodeInfo v = findVideo(root, 0);
                  if (v != null && click(v)) sp.edit().putLong("play_until", 0).apply();
                  return;
                }
                if (until != 0 && isMsgApp(pkg)) {
                  String text = sp.getString("send_text", "");
                  AccessibilityNodeInfo ed = findEditable(root, 0);
                  if (ed == null) return;
                  if (!hasRealText(ed)) {
                    if (text != null && text.length() > 0) setText(ed, text);
                    return;
                  }
                  AccessibilityNodeInfo send = findSend(root, 0);
                  if (send != null && click(send)) sp.edit().putLong("send_until", 0).putString("send_text", "").apply();
                }
              } catch (Throwable t) { }
            }

            // ---------- generic in-app search / chat ----------
            private void done(SharedPreferences sp) {
              sp.edit().putLong("auto_until", 0).putInt("auto_stage", 0).putInt("auto_tries", 0).apply();
            }

            private void auto(SharedPreferences sp, AccessibilityNodeInfo root) {
              String mode = sp.getString("auto_mode", "search");
              String q = sp.getString("auto_q", "");
              String msg = sp.getString("auto_msg", "");
              int stage = sp.getInt("auto_stage", 0);
              int tries = sp.getInt("auto_tries", 0) + 1;
              sp.edit().putInt("auto_tries", tries).apply();
              if (tries > 45) { done(sp); return; }

              if (stage == 0) {
                AccessibilityNodeInfo ed = findField(root, 0, true);
                if (ed == null && tries >= 5) ed = findField(root, 0, false);
                if (ed != null) {
                  if (!sameText(ed, q)) { setText(ed, q); return; }
                  submit(ed, root);
                  if ("chat".equals(mode)) sp.edit().putInt("auto_stage", 1).putInt("auto_tries", 0).apply();
                  else done(sp);
                  return;
                }
                AccessibilityNodeInfo aff = findAffordance(root, 0);
                if (aff != null) click(aff);
                return;
              }
              if (stage == 1) {
                if (tries < 3) return;
                AccessibilityNodeInfo r = findNameNode(root, q.toLowerCase(), 0);
                if (r != null && click(r)) sp.edit().putInt("auto_stage", 2).putInt("auto_tries", 0).apply();
                return;
              }
              AccessibilityNodeInfo c = findField(root, 0, false);
              if (c == null || isSearchy(info(c))) return;
              if (!sameText(c, msg)) { setText(c, msg); return; }
              AccessibilityNodeInfo send = findSend(root, 0);
              if (send != null && click(send)) done(sp);
            }

            private static String info(AccessibilityNodeInfo n) {
              StringBuilder b = new StringBuilder();
              CharSequence t = n.getText();
              if (t != null) b.append(t).append(' ');
              CharSequence d = n.getContentDescription();
              if (d != null) b.append(d).append(' ');
              if (Build.VERSION.SDK_INT >= 26) {
                CharSequence h = n.getHintText();
                if (h != null) b.append(h).append(' ');
              }
              String id = n.getViewIdResourceName();
              if (id != null) b.append(id);
              return b.toString().toLowerCase();
            }

            private static boolean isSearchy(String s) {
              return s.contains("search") || s.contains("find") || s.contains("query") || s.contains("खोज");
            }

            private AccessibilityNodeInfo findField(AccessibilityNodeInfo n, int depth, boolean searchOnly) {
              if (n == null || depth > 30) return null;
              if (n.isEditable() && (!searchOnly || isSearchy(info(n)))) return n;
              for (int i = 0; i < n.getChildCount(); i++) {
                AccessibilityNodeInfo r = findField(n.getChild(i), depth + 1, searchOnly);
                if (r != null) return r;
              }
              return null;
            }

            private AccessibilityNodeInfo findAffordance(AccessibilityNodeInfo n, int depth) {
              if (n == null || depth > 30) return null;
              if (!n.isEditable()) {
                String s = info(n);
                if (s.length() < 70 && isSearchy(s) && (n.isClickable() || hasClickableParent(n))) return n;
              }
              for (int i = 0; i < n.getChildCount(); i++) {
                AccessibilityNodeInfo r = findAffordance(n.getChild(i), depth + 1);
                if (r != null) return r;
              }
              return null;
            }

            private boolean hasClickableParent(AccessibilityNodeInfo n) {
              AccessibilityNodeInfo p = n.getParent();
              int g = 0;
              while (p != null && g < 4) {
                if (p.isClickable()) return true;
                p = p.getParent();
                g++;
              }
              return false;
            }

            private AccessibilityNodeInfo findNameNode(AccessibilityNodeInfo n, String name, int depth) {
              if (n == null || depth > 30 || name.length() == 0) return null;
              if (!n.isEditable()) {
                CharSequence t = n.getText();
                if (t != null && t.toString().toLowerCase().contains(name) && !isSearchy(info(n))) return n;
              }
              for (int i = 0; i < n.getChildCount(); i++) {
                AccessibilityNodeInfo r = findNameNode(n.getChild(i), name, depth + 1);
                if (r != null) return r;
              }
              return null;
            }

            private boolean sameText(AccessibilityNodeInfo n, String s) {
              if (!hasRealText(n)) return false;
              return n.getText().toString().trim().equals(s.trim());
            }

            private boolean setText(AccessibilityNodeInfo n, String s) {
              n.performAction(AccessibilityNodeInfo.ACTION_FOCUS);
              Bundle b = new Bundle();
              b.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, s);
              return n.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, b);
            }

            private boolean click(AccessibilityNodeInfo n) {
              AccessibilityNodeInfo t = n;
              int g = 0;
              while (t != null && !t.isClickable() && g < 5) { t = t.getParent(); g++; }
              return t != null && t.performAction(AccessibilityNodeInfo.ACTION_CLICK);
            }

            private void submit(AccessibilityNodeInfo ed, AccessibilityNodeInfo root) {
              boolean ok = false;
              if (Build.VERSION.SDK_INT >= 30) {
                ok = ed.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.getId());
              }
              if (!ok) {
                AccessibilityNodeInfo b = findAffordance(root, 0);
                if (b != null) click(b);
              }
            }

            // ---------- helpers used by older flows ----------
            private AccessibilityNodeInfo findVideo(AccessibilityNodeInfo n, int depth) {
              if (n == null || depth > 30) return null;
              CharSequence d = n.getContentDescription();
              if (d != null) {
                String ds = d.toString().toLowerCase();
                boolean video = ds.contains("play video") || ds.contains("वीडियो चलाएं");
                if (video && !ds.contains("sponsored") && !ds.contains("shorts")) return n;
              }
              for (int i = 0; i < n.getChildCount(); i++) {
                AccessibilityNodeInfo r = findVideo(n.getChild(i), depth + 1);
                if (r != null) return r;
              }
              return null;
            }

            private boolean hasRealText(AccessibilityNodeInfo n) {
              CharSequence c = n.getText();
              if (c == null || c.length() == 0) return false;
              if (Build.VERSION.SDK_INT >= 26 && n.isShowingHintText()) return false;
              return true;
            }

            private AccessibilityNodeInfo findEditable(AccessibilityNodeInfo n, int depth) {
              return findField(n, depth, false);
            }

            private AccessibilityNodeInfo findSend(AccessibilityNodeInfo n, int depth) {
              if (n == null || depth > 25) return null;
              CharSequence d = n.getContentDescription();
              CharSequence id = n.getViewIdResourceName();
              String ds = d == null ? "" : d.toString().toLowerCase();
              String is = id == null ? "" : id.toString().toLowerCase();
              if (ds.equals("send") || ds.equals("send message") || ds.equals("send sms") || ds.equals("send mms")
                  || ds.equals("भेजें") || is.endsWith(":id/send") || is.endsWith(":id/conversation_send_button")
                  || is.endsWith(":id/send_button") || is.endsWith(":id/send_btn")) {
                return n;
              }
              for (int i = 0; i < n.getChildCount(); i++) {
                AccessibilityNodeInfo r = findSend(n.getChild(i), depth + 1);
                if (r != null) return r;
              }
              return null;
            }
          }
