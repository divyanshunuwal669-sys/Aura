            private static String clean(String s) {
              if (s == null) return "";
              s = s.replaceAll("\\[\\[.*?\\]\\]", "").replaceAll("[*_#`~]", "").replaceAll("\\s+", " ").trim();
              if (s.length() > 600) s = s.substring(0, 600);
              return s;
            }

            private static String post(String url, String[][] headers, String body) {
              HttpURLConnection c = null;
              try {
                c = (HttpURLConnection) new URL(url).openConnection();
                c.setConnectTimeout(10000);
                c.setReadTimeout(20000);
                c.setRequestMethod("POST");
                c.setDoOutput(true);
                c.setRequestProperty("Content-Type", "application/json");
                for (String[] hd : headers) c.setRequestProperty(hd[0], hd[1]);
                OutputStream os = c.getOutputStream();
                os.write(body.getBytes("UTF-8"));
                os.close();
                if (c.getResponseCode() != 200) return null;
                InputStream is = c.getInputStream();
                BufferedReader br = new BufferedReader(new InputStreamReader(is, "UTF-8"));
                StringBuilder sb = new StringBuilder();
                String line;
                while ((line = br.readLine()) != null) sb.append(line);
                br.close();
                return sb.toString();
              } catch (Throwable t) {
                return null;
              } finally {
                if (c != null) c.disconnect();
              }
            }

            private static String callGroq(String key, String sys, ArrayList<String> hist, String text) {
              try {
                JSONArray msgs = new JSONArray();
                msgs.put(new JSONObject().put("role", "system").put("content", sys));
                for (int i = 0; i + 1 < hist.size(); i += 2) {
                  msgs.put(new JSONObject().put("role", "user").put("content", hist.get(i)));
                  msgs.put(new JSONObject().put("role", "assistant").put("content", hist.get(i + 1)));
                }
                msgs.put(new JSONObject().put("role", "user").put("content", text));
                JSONObject body = new JSONObject();
                body.put("model", "llama-3.3-70b-versatile");
                body.put("messages", msgs);
                body.put("max_tokens", 220);
                String r = post("https://api.groq.com/openai/v1/chat/completions", new String[][] { { "Authorization", "Bearer " + key } }, body.toString());
                if (r == null) return null;
                return new JSONObject(r).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content");
              } catch (Throwable t) {
                return null;
              }
            }

            private static String callGemini(String key, String sys, ArrayList<String> hist, String text) {
              try {
                JSONArray cs = new JSONArray();
                for (int i = 0; i + 1 < hist.size(); i += 2) {
                  cs.put(new JSONObject().put("role", "user").put("parts", new JSONArray().put(new JSONObject().put("text", hist.get(i)))));
                  cs.put(new JSONObject().put("role", "model").put("parts", new JSONArray().put(new JSONObject().put("text", hist.get(i + 1)))));
                }
                cs.put(new JSONObject().put("role", "user").put("parts", new JSONArray().put(new JSONObject().put("text", text))));
                JSONObject body = new JSONObject();
                body.put("system_instruction", new JSONObject().put("parts", new JSONArray().put(new JSONObject().put("text", sys))));
                body.put("contents", cs);
                String[] models = new String[] { "gemini-flash-lite-latest", "gemini-flash-latest" };
                for (String m : models) {
                  String r = post("https://generativelanguage.googleapis.com/v1beta/models/" + m + ":generateContent", new String[][] { { "x-goog-api-key", key } }, body.toString());
                  if (r == null) continue;
                  JSONArray parts = new JSONObject(r).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts");
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < parts.length(); i++) sb.append(parts.getJSONObject(i).optString("text", ""));
                  if (sb.length() > 0) return sb.toString();
                }
                return null;
              } catch (Throwable t) {
                return null;
              }
            }

            @Override
            public void onDestroy() {
              alive = false;
              session = false;
              h.removeCallbacksAndMessages(null);
              stopListen();
              try { if (tts != null) { tts.stop(); tts.shutdown(); } } catch (Throwable t) { }
              mute(false);
              super.onDestroy();
            }
          }
