          public class WakeService extends Service {
            private static final String CH = "aura_wake";
            private final Handler h = new Handler(Looper.getMainLooper());
            private SpeechRecognizer sr;
            private AudioManager am;
            private boolean fg = false;
            private boolean muted = false;
            private boolean alive = true;
            private boolean session = false;
            private boolean after = false;
            private boolean ttsReady = false;
            private int empty = 0;
            private long lastWake = 0;
            private String pendingText = null;
            private String pendingDo = null;
            private TextToSpeech tts;
            private final ArrayList<String> hist = new ArrayList<String>();
            private String[] phrases = new String[] { "hey aura" };

            @Override
            public IBinder onBind(Intent intent) { return null; }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
              String a = intent != null ? intent.getAction() : null;
              if ("STOP".equals(a)) {
                alive = false;
                session = false;
                stopListen();
                stopTts();
                mute(false);
                try { stopForeground(true); } catch (Throwable t) { }
                stopSelf();
                return START_NOT_STICKY;
              }
              try {
                startFg();
              } catch (Throwable t) {
                alive = false;
                stopSelf();
                return START_NOT_STICKY;
              }
              loadPhrases();
              if ("FG".equals(a)) {
                fg = true;
                session = false;
                stopListen();
                stopTts();
                mute(false);
              } else if ("BG".equals(a)) {
                fg = false;
                if (!session) listenSoon(400);
              } else {
                if (!session) listenSoon(400);
              }
              return START_STICKY;
            }

            private SharedPreferences sp() { return getSharedPreferences("aura", Context.MODE_PRIVATE); }

            private void loadPhrases() {
              try {
                String s = sp().getString("phrases", "hey aura");
                if (s != null && s.length() > 0) phrases = s.split("\\|");
              } catch (Throwable t) { }
            }

            private void startFg() {
              NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
              if (Build.VERSION.SDK_INT >= 26) {
                nm.createNotificationChannel(new NotificationChannel(CH, "Aura Hey Aura", NotificationManager.IMPORTANCE_LOW));
              }
              Intent open = getPackageManager().getLaunchIntentForPackage(getPackageName());
              PendingIntent pi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, CH) : new Notification.Builder(this);
              b.setContentTitle("Aura sun rahi hai");
              b.setContentText("Hey Aura bolo");
              b.setSmallIcon(android.R.drawable.ic_btn_speak_now);
              b.setContentIntent(pi);
              b.setOngoing(true);
              Notification n = b.build();
              if (Build.VERSION.SDK_INT >= 30) startForeground(77, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
              else startForeground(77, n);
            }

            private final Runnable listenR = new Runnable() {
              public void run() { if (alive && !fg && !session) startListen(); }
            };

            private void listenSoon(long ms) {
              h.removeCallbacks(listenR);
              h.postDelayed(listenR, ms);
            }

            // ---------- wake word listening ----------
            private void startListen() {
              try {
                if (!SpeechRecognizer.isRecognitionAvailable(this)) return;
                stopListen();
                mute(true);
                sr = SpeechRecognizer.createSpeechRecognizer(this);
                sr.setRecognitionListener(new RecognitionListener() {
                  public void onReadyForSpeech(Bundle p) { }
                  public void onBeginningOfSpeech() { }
                  public void onRmsChanged(float v) { }
                  public void onBufferReceived(byte[] b) { }
                  public void onEndOfSpeech() { }
                  public void onError(int e) {
                    if (session) return;
                    if (e == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) { alive = false; stopSelf(); }
                    else if (e == SpeechRecognizer.ERROR_RECOGNIZER_BUSY) listenSoon(2000);
                    else listenSoon(700);
                  }
                  public void onResults(Bundle r) { if (!session && !check(r)) listenSoon(300); }
                  public void onPartialResults(Bundle r) { if (!session) check(r); }
                  public void onEvent(int t, Bundle b) { }
                });
                Intent it = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                it.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                it.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN");
                it.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                it.putExtra(RecognizerIntent.EXTRA_PREFER_OFFLINE, true);
                sr.startListening(it);
              } catch (Throwable t) {
                listenSoon(3000);
              }
            }

            private void stopListen() {
              try {
                if (sr != null) {
                  sr.cancel();
                  sr.destroy();
                }
              } catch (Throwable t) { }
              sr = null;
            }

            private void mute(boolean m) {
              try {
                if (am == null) am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                if (m && !muted) {
                  am.adjustStreamVolume(AudioManager.STREAM_NOTIFICATION, AudioManager.ADJUST_MUTE, 0);
                  muted = true;
                } else if (!m && muted) {
                  am.adjustStreamVolume(AudioManager.STREAM_NOTIFICATION, AudioManager.ADJUST_UNMUTE, 0);
                  muted = false;
                }
              } catch (Throwable t) { }
            }

            private static String norm(String s) {
              if (s == null) return "";
              return s.toLowerCase().replaceAll("[^\\p{L}\\p{M}\\p{N} ]", " ").replaceAll("\\s+", " ").trim();
            }

            private boolean check(Bundle r) {
              if (r == null) return false;
              ArrayList<String> l = r.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
              if (l == null) return false;
              for (String s : l) {
                String n = norm(s);
                for (String p : phrases) {
                  String q = norm(p);
                  if (q.length() > 2 && n.contains(q)) {
                    onWake();
                    return true;
                  }
                }
              }
              return false;
            }

            private void onWake() {
              long now = System.currentTimeMillis();
              if (now - lastWake < 6000) return;
              lastWake = now;
              stopListen();
              boolean bg = sp().getBoolean("bg", true);
              boolean hasKey = sp().getString("gk", "").length() > 5 || sp().getString("qk", "").length() > 5;
              if (bg && hasKey) {
                session = true;
                empty = 0;
                mute(false);
                speak("Haan, boliye.", true);
              } else {
                mute(false);
                launchAura();
                h.postDelayed(new Runnable() {
                  public void run() { if (alive && !fg && !session) listenSoon(200); }
                }, 15000);
              }
            }

            private void launchAura() {
              try {
                Intent i = new Intent();
                i.setClassName(getPackageName(), getPackageName() + ".MainActivity");
                i.setAction("aura.WAKE");
                i.putExtra("aura_wake", true);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                startActivity(i);
              } catch (Throwable t) { }
            }

            // ---------- background voice session ----------
            private final Runnable afterSpeak = new Runnable() {
              public void run() {
                if (!alive || !session) return;
                if (after) listenCmd(); else endSession();
              }
            };

            private void endSession() {
              session = false;
              pendingDo = null;
              stopListen();
              stopTts();
              mute(false);
              hist.clear();
              if (alive && !fg) listenSoon(900);
            }

            private volatile int speakGen = 0;
            private volatile AudioTrack curTrack = null;
            private long gemFailUntil = 0;
            private long edgeFailUntil = 0;
            private volatile boolean gfNow = false;

            private void stopTts() {
              speakGen++;
              try { if (tts != null) tts.stop(); } catch (Throwable t) { }
              try { AudioTrack a = curTrack; if (a != null) { a.pause(); a.flush(); a.release(); } } catch (Throwable t) { }
              curTrack = null;
            }

            // Gemini natural voice first (needs internet); phone TTS as fallback
            private void speak(final String t, final boolean thenListen) {
              final String gk = sp().getString("gk", "");
              final String ek = sp().getString("ek", "");
              final String ev = sp().getString("ev", "");
              final String smk = sp().getString("smk", "");
              final String smv = sp().getString("smv", "");
              final String edv = sp().getString("edv", "");
              final boolean gfm = "1".equals(sp().getString("gfm", "0"));
              final String smn = sp().getString("smn", "");
              final boolean edgeOk = System.currentTimeMillis() >= edgeFailUntil;
              final boolean cloudOk = (gk.length() >= 6 || ek.length() >= 6 || smk.length() >= 6) && System.currentTimeMillis() >= gemFailUntil;
              if ((!edgeOk && !cloudOk) || t == null || t.length() == 0) {
                localSpeak(t, thenListen);
                return;
              }
              after = thenListen;
              stopTts();
              final int my = ++speakGen;
              new Thread(new Runnable() {
                public void run() {
                  String t1 = EdgeTts.clean(t);
                  String tt = t1.length() > 500 ? t1.substring(0, 500) : t1;
                  byte[] p0 = null;
                  if (tt.length() < 1) { h.post(afterSpeak); return; }
                  if (edgeOk) {
                    p0 = EdgeTts.synth(tt, edv, gfm);
                    if (p0 == null) edgeFailUntil = System.currentTimeMillis() + 90000;
                  }
                  if (cloudOk) {
                    if (p0 == null && smk.length() >= 6) p0 = sarvamTts(smk, gfm ? smv : (smn.length() > 1 ? smn : "ritu"), tt, gfm);
                    if (p0 == null && ek.length() >= 6) p0 = elevenTts(ek, ev, tt);
                    if (p0 == null && gk.length() >= 6) { gfNow = gfm; p0 = geminiTts(gk, tt); }
                  }
                  final byte[] pcm = p0;
                  if (my != speakGen) return;
                  if (pcm == null) {
                    if (cloudOk) gemFailUntil = System.currentTimeMillis() + 60000;
                    h.post(new Runnable() { public void run() { if (my == speakGen) localSpeak(t, thenListen); } });
                    return;
                  }
                  playPcm(pcm, my);
                }
              }).start();
            }

            private byte[] sarvamTts(String key, String speaker, String text, boolean gfm) {
              try {
                JSONObject body = new JSONObject().put("text", text).put("language_code", "hi-IN").put("model", "bulbul:v3")
                  .put("speaker", (speaker.length() > 1 ? speaker : "priya").toLowerCase()).put("pace", gfm ? 0.92 : 0.95).put("speech_sample_rate", 24000).put("output_audio_codec", "wav");
                HttpURLConnection c = (HttpURLConnection) new URL("https://api.sarvam.ai/text-to-speech").openConnection();
                c.setConnectTimeout(5000);
                c.setReadTimeout(12000);
                c.setRequestMethod("POST");
                c.setDoOutput(true);
                c.setRequestProperty("Content-Type", "application/json");
                c.setRequestProperty("api-subscription-key", key);
                OutputStream os = c.getOutputStream();
                os.write(body.toString().getBytes("UTF-8"));
                os.close();
                if (c.getResponseCode() != 200) { c.disconnect(); return null; }
                BufferedReader br = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"));
                StringBuilder sb = new StringBuilder();
                String ln;
                while ((ln = br.readLine()) != null) sb.append(ln);
                br.close();
                c.disconnect();
                byte[] w = Base64.decode(new JSONObject(sb.toString()).getJSONArray("audios").getString(0), Base64.DEFAULT);
                int off = 44;
                for (int i = 12; i < Math.min(w.length - 8, 400); i++) {
                  if (w[i] == 'd' && w[i + 1] == 'a' && w[i + 2] == 't' && w[i + 3] == 'a') { off = i + 8; break; }
                }
                if (w.length - off < 2000) return null;
                byte[] pcm = new byte[w.length - off];
                System.arraycopy(w, off, pcm, 0, pcm.length);
                return pcm;
              } catch (Throwable e) {
                return null;
              }
            }

            private byte[] elevenTts(String key, String voice, String text) {
              try {
                String v = voice.length() > 5 ? voice : "21m00Tcm4TlvDq8ikWAM";
                JSONObject body = new JSONObject().put("text", text).put("model_id", "eleven_flash_v2_5");
                HttpURLConnection c = (HttpURLConnection) new URL("https://api.elevenlabs.io/v1/text-to-speech/" + Uri.encode(v) + "?output_format=pcm_24000").openConnection();
                c.setConnectTimeout(5000);
                c.setReadTimeout(12000);
                c.setRequestMethod("POST");
                c.setDoOutput(true);
                c.setRequestProperty("Content-Type", "application/json");
                c.setRequestProperty("xi-api-key", key);
                OutputStream os = c.getOutputStream();
                os.write(body.toString().getBytes("UTF-8"));
                os.close();
                if (c.getResponseCode() != 200) { c.disconnect(); return null; }
                InputStream is = c.getInputStream();
                java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream();
                byte[] buf = new byte[8192];
                int n;
                while ((n = is.read(buf)) > 0) bo.write(buf, 0, n);
                is.close();
                c.disconnect();
                byte[] d = bo.toByteArray();
                return d.length > 2000 ? d : null;
              } catch (Throwable e) {
                return null;
              }
            }

            private byte[] geminiTts(String key, String text) {
              String[] models = new String[] { "gemini-2.5-flash-preview-tts" };
              for (String m : models) {
                try {
                  JSONObject body = new JSONObject();
                  body.put("contents", new JSONArray().put(new JSONObject().put("parts", new JSONArray().put(new JSONObject().put("text", text)))));
                  JSONObject voice = new JSONObject().put("prebuiltVoiceConfig", new JSONObject().put("voiceName", gfNow ? "Leda" : "Kore"));
                  body.put("generationConfig", new JSONObject()
                    .put("responseModalities", new JSONArray().put("AUDIO"))
                    .put("speechConfig", new JSONObject().put("voiceConfig", voice)));
                  HttpURLConnection c = (HttpURLConnection) new URL("https://generativelanguage.googleapis.com/v1beta/models/" + m + ":generateContent").openConnection();
                  c.setConnectTimeout(5000);
                  c.setReadTimeout(12000);
                  c.setRequestMethod("POST");
                  c.setDoOutput(true);
                  c.setRequestProperty("Content-Type", "application/json");
                  c.setRequestProperty("x-goog-api-key", key);
                  OutputStream os = c.getOutputStream();
                  os.write(body.toString().getBytes("UTF-8"));
                  os.close();
                  if (c.getResponseCode() != 200) { c.disconnect(); continue; }
                  BufferedReader br = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"));
                  StringBuilder sb = new StringBuilder();
                  String ln;
                  while ((ln = br.readLine()) != null) sb.append(ln);
                  br.close();
                  c.disconnect();
                  String b64 = new JSONObject(sb.toString()).getJSONArray("candidates").getJSONObject(0)
                    .getJSONObject("content").getJSONArray("parts").getJSONObject(0).getJSONObject("inlineData").getString("data");
                  byte[] d = Base64.decode(b64, Base64.DEFAULT);
                  if (d.length > 2000) return d;
                } catch (Throwable e) { }
              }
              return null;
            }

            private void playPcm(byte[] pcm, int my) {
              try {
                int min = AudioTrack.getMinBufferSize(24000, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT);
                AudioTrack a = new AudioTrack.Builder()
                  .setAudioAttributes(new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build())
                  .setAudioFormat(new AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(24000).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                  .setBufferSizeInBytes(Math.max(min, 8192))
                  .setTransferMode(AudioTrack.MODE_STREAM)
                  .build();
                curTrack = a;
                a.play();
                int off = 0;
                while (off < pcm.length && my == speakGen) {
                  int n = a.write(pcm, off, Math.min(4096, pcm.length - off));
                  if (n <= 0) break;
                  off += n;
                }
                if (my == speakGen) {
                  try { Thread.sleep(250); } catch (Throwable e) { }
                }
                try { a.release(); } catch (Throwable e) { }
                if (curTrack == a) curTrack = null;
                if (my == speakGen) h.post(afterSpeak);
              } catch (Throwable e) {
                if (my == speakGen) h.post(new Runnable() { public void run() { afterSpeak.run(); } });
              }
            }

            private void localSpeak(String t, boolean thenListen) {
              after = thenListen;
              pendingText = t;
              if (tts == null) {
                try {
                  tts = new TextToSpeech(getApplicationContext(), new TextToSpeech.OnInitListener() {
                    public void onInit(int status) {
                      ttsReady = status == TextToSpeech.SUCCESS;
                      if (ttsReady) {
                        try {
                          tts.setLanguage(new Locale("en", "IN"));
                          try {
                            android.speech.tts.Voice best = null;
                            for (android.speech.tts.Voice v : tts.getVoices()) {
                              if (!"en".equals(v.getLocale().getLanguage()) || !"IN".equals(v.getLocale().getCountry())) continue;
                              if (v.getFeatures() != null && v.getFeatures().contains("notInstalled")) continue;
                              if (best == null || v.getQuality() > best.getQuality()) best = v;
                            }
                            if (best != null) tts.setVoice(best);
                            tts.setSpeechRate(0.95f);
                          } catch (Throwable ve) { }
                          tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                            public void onStart(String id) { }
                            public void onDone(String id) { h.post(afterSpeak); }
                            public void onError(String id) { h.post(afterSpeak); }
                          });
                        } catch (Throwable e) { ttsReady = false; }
                      }
                      h.post(new Runnable() { public void run() { flushSpeak(); } });
                    }
                  });
                } catch (Throwable e) {
                  ttsReady = false;
                  h.post(afterSpeak);
                }
              } else if (ttsReady) {
                flushSpeak();
              }
            }

            private void flushSpeak() {
              String t = pendingText;
              pendingText = null;
              if (t == null) return;
              if (!ttsReady || tts == null) { h.post(afterSpeak); return; }
              try {
                tts.speak(t, TextToSpeech.QUEUE_FLUSH, new Bundle(), "aura");
              } catch (Throwable e) {
                h.post(afterSpeak);
              }
            }

            private void listenCmd() {
              try {
                stopListen();
                mute(true);
                sr = SpeechRecognizer.createSpeechRecognizer(this);
                sr.setRecognitionListener(new RecognitionListener() {
                  public void onReadyForSpeech(Bundle p) { }
                  public void onBeginningOfSpeech() { }
                  public void onRmsChanged(float v) { }
                  public void onBufferReceived(byte[] b) { }
                  public void onEndOfSpeech() { }
                  public void onPartialResults(Bundle r) { }
                  public void onEvent(int t, Bundle b) { }
                  public void onError(int e) {
                    if (!session) return;
                    if (e == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) { endSession(); return; }
                    emptyTurn();
                  }
                  public void onResults(Bundle r) {
                    if (!session) return;
                    ArrayList<String> l = r == null ? null : r.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                    if (l == null || l.size() == 0 || l.get(0).trim().length() == 0) { emptyTurn(); return; }
                    empty = 0;
                    handleCmd(l.get(0).trim());
                  }
                });
                Intent it = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                it.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                it.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN");
                it.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1);
                sr.startListening(it);
              } catch (Throwable t) {
                endSession();
              }
            }

            private void emptyTurn() {
              empty++;
              if (empty >= 2) {
                endSession();
              } else {
                h.postDelayed(new Runnable() { public void run() { if (alive && session) listenCmd(); } }, 400);
              }
            }

            private void handleCmd(String raw) {
              String n = norm(raw);
              if (pendingDo != null) {
                String g = pendingDo;
                pendingDo = null;
                if (n.matches("(haan|han|ha|haa|yes|yeah|ok|okay|theek hai|thik hai|kar do|karo|bilkul)( .*)?")) runAgent(g);
                else speak("Theek hai, cancel kar diya.", false);
                return;
              }
              if (n.matches("(bas|bas itna|band karo|band kar do|bye|ok bye|alvida|shukriya|dhanyavad|thank you|thanks|that s all)")) {
                speak("Theek hai. Jab chahiye Hey Aura bolna.", false);
                return;
              }
              int key = mediaKey(n);
              if (key != 0) {
                sendKey(key);
                speak("Ho gaya.", false);
                return;
              }
              if (n.matches("(aura |app )?(me|mein|men) (le chalo|chalo|aao|aa jao|wapas aao)|(aura |app )?wapas (chalo|aao)")) {
                speak("Aura khol rahi hoon.", false);
                h.postDelayed(new Runnable() { public void run() { openSelf(); } }, 900);
                return;
              }
              String song = songQuery(n);
              if (song != null) {
                boolean played = playSong(song);
                speak(played ? "Gana chala rahi hoon." : "YouTube par dhoondh rahi hoon.", false);
                return;
              }
              String[] tg = toggleCmd(n);
              if (tg != null) {
                speak(doToggle(tg[0], tg[1]), false);
                return;
              }
              String sk = settingsKey(n);
              if (sk != null) {
                openSettingsPage(sk);
                speak("Settings khol rahi hoon.", false);
                return;
              }
              Matcher sm = Pattern.compile("(?:aura )?(.+?) (?:me|mein|men|par|pe) (.{2,}?) (?:search karo|search kar do|search|dhundo|dhoondo|dhundh do|khojo)").matcher(n);
              if (!sm.matches()) sm = Pattern.compile("(?:aura )?(.+?) (?:me|mein|men|par|pe) search (?:karo|kar do) (.{2,})").matcher(n);
              if (sm.matches()) {
                speak(appSearch(sm.group(1).trim(), sm.group(2).trim()), false);
                return;
              }
              String app = appName(n);
              if (app != null) {
                String label = openByName(app);
                if (label != null) speak(label + " khol rahi hoon.", false);
                else speak(app + " naam ka app mujhe nahi mila.", true);
                return;
              }
              if (n.matches(".*\\b(yaad|remind|reminder|note|todo|whatsapp|message|sms|call|delete|mitao|bhejo|bhej do|payment|pay)\\b.*")) {
                speak("Ye kaam confirm karke hota hai, isliye Aura app khol rahi hoon.", false);
                h.postDelayed(new Runnable() { public void run() { launchAura(); } }, 1500);
                return;
              }
              askAi(raw);
            }

            // ---------- local commands ----------
            private int mediaKey(String n) {
              String w = "(?:music|gana|song|video|track)";
              if (n.matches("(?:aura )?(?:" + w + " )?(?:pause|roko|ruko|rok do)(?: " + w + ")?(?: kar(?:o| do|do))?") || n.matches(w + " (?:band|stop)(?: kar(?:o| do|do))?")) return KeyEvent.KEYCODE_MEDIA_PAUSE;
              if (n.matches("(?:aura )?(?:" + w + " )?(?:play|resume|chalao|chala do|chalu karo|chalu kar do|shuru karo)(?: " + w + ")?(?: kar(?:o| do|do))?")) return KeyEvent.KEYCODE_MEDIA_PLAY;
              if (n.matches("(?:aura )?(?:next|agla|agle|skip)(?: " + w + ")?(?: (?:lagao|chalao|karo|kar do))?")) return KeyEvent.KEYCODE_MEDIA_NEXT;
              if (n.matches("(?:aura )?(?:previous|prev|pichla|pichle)(?: " + w + ")?(?: (?:lagao|chalao|karo|kar do))?")) return KeyEvent.KEYCODE_MEDIA_PREVIOUS;
              return 0;
