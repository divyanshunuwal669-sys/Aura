          package com.divyanshu.aura;

          import android.app.ActivityManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.drawable.Drawable;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.Environment;
          import android.os.StatFs;
          import android.os.SystemClock;
          import android.util.Base64;
          import java.io.ByteArrayOutputStream;
          import org.json.JSONObject;

          // Device stats + app icons for the AURA HUD. Read-only, no personal data.
          public class HudNative {
            public static String stats(Context c) {
              JSONObject o = new JSONObject();
              try {
                Intent b = c.registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                if (b != null) {
                  int lv = b.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
                  int sc = b.getIntExtra(BatteryManager.EXTRA_SCALE, 100);
                  o.put("bat", sc > 0 ? lv * 100 / sc : -1);
                  o.put("temp", b.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) / 10.0);
                  int st = b.getIntExtra(BatteryManager.EXTRA_STATUS, -1);
                  o.put("chg", st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL);
                }
              } catch (Throwable t) { }
              try {
                ActivityManager am = (ActivityManager) c.getSystemService(Context.ACTIVITY_SERVICE);
                ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                am.getMemoryInfo(mi);
                o.put("ramTotal", mi.totalMem);
                o.put("ramFree", mi.availMem);
              } catch (Throwable t) { }
              try {
                StatFs sf = new StatFs(Environment.getDataDirectory().getPath());
                o.put("stTotal", sf.getTotalBytes());
                o.put("stFree", sf.getAvailableBytes());
              } catch (Throwable t) { }
              try {
                o.put("up", SystemClock.elapsedRealtime() / 1000);
                o.put("rel", Build.VERSION.RELEASE);
                o.put("model", Build.MODEL);
              } catch (Throwable t) { }
              try {
                ConnectivityManager cm = (ConnectivityManager) c.getSystemService(Context.CONNECTIVITY_SERVICE);
                Network n = cm.getActiveNetwork();
                if (n == null) {
                  o.put("net", "OFFLINE");
                } else {
                  NetworkCapabilities nc = cm.getNetworkCapabilities(n);
                  if (nc != null) {
                    o.put("net", nc.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) ? "WIFI" : (nc.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) ? "MOBILE" : "OTHER"));
                    o.put("down", nc.getLinkDownstreamBandwidthKbps() / 1000);
                  }
                }
              } catch (Throwable t) { }
              return o.toString();
            }

            public static String icon(Context c, String pkg) {
              try {
                Drawable d = c.getPackageManager().getApplicationIcon(pkg);
                int s = 128;
                Bitmap bm = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888);
                Canvas cv = new Canvas(bm);
                d.setBounds(0, 0, s, s);
                d.draw(cv);
                ByteArrayOutputStream bo = new ByteArrayOutputStream();
                bm.compress(Bitmap.CompressFormat.PNG, 100, bo);
                return Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP);
              } catch (Throwable t) {
                return "";
              }
            }
          }
