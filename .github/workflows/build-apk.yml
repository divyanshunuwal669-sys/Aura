            }

            private static int lev(String a, String b) {
              int[] p = new int[b.length() + 1];
              for (int j = 0; j <= b.length(); j++) p[j] = j;
              for (int i = 1; i <= a.length(); i++) {
                int[] c = new int[b.length() + 1];
                c[0] = i;
                for (int j = 1; j <= b.length(); j++) {
                  int cost = a.charAt(i - 1) == b.charAt(j - 1) ? 0 : 1;
                  c[j] = Math.min(Math.min(c[j - 1] + 1, p[j] + 1), p[j - 1] + cost);
                }
                p = c;
              }
              return p[b.length()];
            }

            private String[] findPkg(String q0) {
              try {
                String q = alias(norm(q0)).replace(" ", "");
                if (q.length() == 0) return null;
                PackageManager pm = getPackageManager();
                Intent main = new Intent(Intent.ACTION_MAIN, null);
                main.addCategory(Intent.CATEGORY_LAUNCHER);
                List<ResolveInfo> list = pm.queryIntentActivities(main, 0);
                String bestPkg = null;
                String bestLabel = null;
                double best = 0;
                for (ResolveInfo ri : list) {
                  String label = ri.loadLabel(pm).toString();
                  String ln = norm(label).replace(" ", "");
                  if (ln.length() == 0) continue;
                  double sc = 0;
                  if (ln.equals(q)) sc = 100;
                  else if (ln.startsWith(q)) sc = 80;
                  else if (ln.contains(q)) sc = 60;
                  else if (ln.length() > 3 && q.contains(ln)) sc = 50;
                  else if (q.length() >= 4 && lev(ln, q) <= (q.length() >= 7 ? 2 : 1)) sc = 40;
                  if (sc > 0) {
                    sc -= ln.length() / 100.0;
                    if (sc > best) { best = sc; bestPkg = ri.activityInfo.packageName; bestLabel = label; }
                  }
                }
                if (bestPkg == null) return null;
                return new String[] { bestPkg, bestLabel };
              } catch (Throwable t) {
                return null;
              }
            }

            private String openByName(String q0) {
              try {
                String[] r = findPkg(q0);
                if (r == null) return null;
                Intent i = getPackageManager().getLaunchIntentForPackage(r[0]);
                if (i == null) return null;
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                startActivity(i);
                return r[1];
              } catch (Throwable t) {
                return null;
              }
            }

            private boolean accessOn() {
              try {
                String s = Settings.Secure.getString(getContentResolver(), Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                return s != null && s.contains(getPackageName()) && s.contains("SendService");
              } catch (Throwable t) {
                return false;
              }
            }

            private static boolean blockedPkg(String pkg) {
              String p = pkg.toLowerCase();
              String[] bl = new String[] { "paisa", "phonepe", "paytm", "bhim", "upi", "bank", "wallet", "razorpay", "cred.club", "payment", "pay" };
              for (String b : bl) if (p.contains(b)) return true;
              return false;
            }

            // returns spoken reply
            private String appSearch(String app, String q) {
              if (app.matches("(youtube|yt)")) {
                try {
                  Intent v = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/results?search_query=" + Uri.encode(q)));
                  v.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  v.setPackage("com.google.android.youtube");
                  startActivity(v);
                  return "YouTube par " + q + " dhoondh rahi hoon.";
                } catch (Throwable t) { }
              }
              String[] r = findPkg(app);
              if (r == null) return app + " naam ka app mujhe nahi mila.";
              if (blockedPkg(r[0])) return "Payment ya bank app mein main kuch nahi karti.";
              if (!accessOn()) return "Kisi app ke andar search karne ke liye Aura mein Accessibility on karna hoga.";
              try {
                Intent i = getPackageManager().getLaunchIntentForPackage(r[0]);
                if (i == null) return r[1] + " khul nahi paya.";
                sp().edit().putString("auto_pkg", r[0]).putString("auto_mode", "search").putString("auto_q", q)
                  .putString("auto_msg", "").putInt("auto_stage", 0).putInt("auto_tries", 0)
                  .putLong("auto_until", System.currentTimeMillis() + 45000).apply();
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                startActivity(i);
                return r[1] + " mein " + q + " search kar rahi hoon.";
              } catch (Throwable t) {
                return "Search nahi ho paya.";
              }
            }

