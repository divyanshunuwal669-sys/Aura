name: Build Aura APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon.svg www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications @capacitor/app-launcher @capacitor-community/speech-recognition @capacitor-community/text-to-speech @capawesome/capacitor-volume @capawesome/capacitor-torch @capgo/capacitor-brightness --legacy-peer-deps
          npx cap init Aura com.divyanshu.aura --web-dir=www
          npx cap add android
          D=android/app/src/main/java/com/divyanshu/aura
          R=android/app/src/main/res
          mkdir -p $D $R/xml $R/values
          cat > $D/AuraNativePlugin.java << 'EOF'
          package com.divyanshu.aura;

          import android.app.Activity;
          import android.app.SearchManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.view.KeyEvent;
          import android.view.WindowManager;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.List;

          @CapacitorPlugin(name = "AuraNative")
          public class AuraNativePlugin extends Plugin {
            private static final String WS = "com.divyanshu.aura.WakeService";

            @Override
            public void load() {
              try {
                Intent i = getActivity().getIntent();
                if (i != null && (i.getBooleanExtra("aura_wake", false) || "aura.WAKE".equals(i.getAction()))) {
                  i.removeExtra("aura_wake");
                  i.setAction(Intent.ACTION_MAIN);
                  lockShow(true);
                  notifyListeners("wake", new JSObject(), true);
                }
              } catch (Throwable t) { }
            }

            @Override
            protected void handleOnNewIntent(Intent intent) {
              super.handleOnNewIntent(intent);
              try {
                if (intent != null && (intent.getBooleanExtra("aura_wake", false) || "aura.WAKE".equals(intent.getAction()))) {
                  intent.removeExtra("aura_wake");
                  lockShow(true);
                  notifyListeners("wake", new JSObject(), true);
                }
              } catch (Throwable t) { }
            }

            @Override
            protected void handleOnResume() {
              super.handleOnResume();
              wakeAction("FG");
            }

            @Override
            protected void handleOnPause() {
              super.handleOnPause();
              lockShow(false);
              wakeAction("BG");
            }


            private void lockShow(final boolean on) {
              try {
                final Activity a = getActivity();
                a.runOnUiThread(new Runnable() {
                  public void run() {
                    try {
                      if (Build.VERSION.SDK_INT >= 27) {
                        a.setShowWhenLocked(on);
                        a.setTurnScreenOn(on);
                      } else {
                        int f = WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON;
                        if (on) a.getWindow().addFlags(f); else a.getWindow().clearFlags(f);
                      }
                    } catch (Throwable t) { }
                  }
                });
              } catch (Throwable t) { }
            }

            private void wakeAction(String a) {
              try {
                Context c = getContext();
                if (!c.getSharedPreferences("aura", Context.MODE_PRIVATE).getBoolean("wake", false)) return;
                Intent i = new Intent(c, Class.forName(WS));
                i.setAction(a);
                c.startService(i);
              } catch (Throwable t) { }
            }

            @PluginMethod
            public void launch(PluginCall call) {
              String pkg = call.getString("package");
              if (pkg == null) { call.reject("package missing"); return; }
              Intent i = getContext().getPackageManager().getLaunchIntentForPackage(pkg);
              if (i == null) { call.reject("app launch nahi ho sakta"); return; }
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              getContext().startActivity(i);
              call.resolve();
            }

            @PluginMethod
            public void listApps(PluginCall call) {
              PackageManager pm = getContext().getPackageManager();
              Intent main = new Intent(Intent.ACTION_MAIN, null);
              main.addCategory(Intent.CATEGORY_LAUNCHER);
              List<ResolveInfo> list = pm.queryIntentActivities(main, 0);
              JSArray arr = new JSArray();
              for (ResolveInfo ri : list) {
                JSObject o = new JSObject();
                o.put("name", ri.loadLabel(pm).toString());
                o.put("package", ri.activityInfo.packageName);
                arr.put(o);
              }
              JSObject r = new JSObject();
              r.put("apps", arr);
              call.resolve(r);
            }

            @PluginMethod
            public void media(PluginCall call) {
              String k = call.getString("key", "");
              int code;
              if ("play".equals(k)) code = KeyEvent.KEYCODE_MEDIA_PLAY;
              else if ("pause".equals(k)) code = KeyEvent.KEYCODE_MEDIA_PAUSE;
              else if ("toggle".equals(k)) code = KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE;
              else if ("next".equals(k)) code = KeyEvent.KEYCODE_MEDIA_NEXT;
              else if ("prev".equals(k)) code = KeyEvent.KEYCODE_MEDIA_PREVIOUS;
              else if ("stop".equals(k)) code = KeyEvent.KEYCODE_MEDIA_STOP;
              else { call.reject("unknown key"); return; }
              try {
                AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, code));
                am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, code));
                call.resolve();
              } catch (Throwable t) {
                call.reject("media key nahi gaya: " + t.getMessage());
              }
            }

            @PluginMethod
            public void wakeStart(PluginCall call) {
              try {
                Context c = getContext();
                boolean force = call.getBoolean("force", false);
                boolean canOverlay = Build.VERSION.SDK_INT < 23 || Settings.canDrawOverlays(c);
                if (!canOverlay && !force) {
                  JSObject r = new JSObject();
                  r.put("overlay", false);
                  call.resolve(r);
                  return;
                }
                JSArray arr = call.getArray("phrases");
                StringBuilder sb = new StringBuilder();
                if (arr != null) {
                  for (int k = 0; k < arr.length(); k++) {
                    if (k > 0) sb.append("|");
                    sb.append(arr.getString(k));
                  }
                }
                c.getSharedPreferences("aura", Context.MODE_PRIVATE).edit()
                  .putString("phrases", sb.toString()).putBoolean("wake", true).apply();
                Intent i = new Intent(c, Class.forName(WS));
                i.setAction("START");
                if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(i); else c.startService(i);
                wakeAction("FG");
                JSObject r = new JSObject();
                r.put("overlay", canOverlay);
                r.put("started", true);
                call.resolve(r);
              } catch (ClassNotFoundException e) {
                call.reject("Hey Aura module is build mein nahi hai");
              } catch (Throwable t) {
                call.reject("Hey Aura start nahi hua: " + t.getMessage());
              }
            }

            @PluginMethod
            public void wakeStop(PluginCall call) {
              try {
                Context c = getContext();
                c.getSharedPreferences("aura", Context.MODE_PRIVATE).edit().putBoolean("wake", false).apply();
                Intent i = new Intent(c, Class.forName(WS));
                i.setAction("STOP");
                c.startService(i);
              } catch (Throwable t) { }
              call.resolve();
            }

            @PluginMethod
            public void wakeOverlaySettings(PluginCall call) {
              try {
                Intent i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                  Uri.parse("package:" + getContext().getPackageName()));
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(i);
              } catch (Throwable t) { }
              call.resolve();
            }

            @PluginMethod
            public void view(PluginCall call) {
              String url = call.getString("url");
              if (url == null || url.length() == 0) { call.reject("url missing"); return; }
              String pkg = call.getString("package");
              try {
                Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                if (pkg != null && pkg.length() > 0) i.setPackage(pkg);
                try {
                  getContext().startActivity(i);
                } catch (Throwable e1) {
                  if (pkg == null || pkg.length() == 0) throw e1;
                  i.setPackage(null);
                  getContext().startActivity(i);
                }
                call.resolve();
              } catch (Throwable t) {
                call.reject("link khul nahi paya: " + t.getMessage());
              }
            }

            @PluginMethod
            public void bringFront(PluginCall call) {
              try {
                Context c = getContext();
                Intent i = c.getPackageManager().getLaunchIntentForPackage(c.getPackageName());
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                c.startActivity(i);
                call.resolve();
              } catch (Throwable t) {
                call.reject("Aura aage nahi aa payi: " + t.getMessage());
              }
            }

            @PluginMethod
            public void playSearch(PluginCall call) {
              String q = call.getString("query");
              if (q == null || q.trim().length() == 0) { call.reject("query missing"); return; }
              Context c = getContext();
              String[] pk = new String[] { "com.google.android.apps.youtube.music", "com.spotify.music" };
              for (String p : pk) {
                try {
                  Intent i = new Intent(MediaStore.INTENT_ACTION_MEDIA_PLAY_FROM_SEARCH);
                  i.setPackage(p);
                  i.putExtra(MediaStore.EXTRA_MEDIA_FOCUS, "vnd.android.cursor.item/*");
                  i.putExtra(SearchManager.QUERY, q);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  if (i.resolveActivity(c.getPackageManager()) != null) {
                    c.startActivity(i);
                    JSObject r = new JSObject();
                    r.put("played", true);
                    r.put("app", p);
                    call.resolve(r);
                    return;
                  }
                } catch (Throwable t) { }
              }
              try {
                c.getSharedPreferences("aura", Context.MODE_PRIVATE).edit().putLong("play_until", System.currentTimeMillis() + 25000).apply();
                Intent v = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/results?search_query=" + Uri.encode(q)));
                v.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                  v.setPackage("com.google.android.youtube");
                  c.startActivity(v);
                } catch (Throwable e2) {
                  v.setPackage(null);
                  c.startActivity(v);
                }
                JSObject r = new JSObject();
                r.put("played", false);
                call.resolve(r);
              } catch (Throwable t) {
                call.reject("gana nahi khul paya: " + t.getMessage());
              }
            }

            @PluginMethod
            public void armSend(PluginCall call) {
              String t = call.getString("text", "");
              getContext().getSharedPreferences("aura", Context.MODE_PRIVATE).edit()
                .putString("send_text", t).putLong("send_until", System.currentTimeMillis() + 25000).apply();
              call.resolve();
            }

            @PluginMethod
            public void accessStatus(PluginCall call) {
              boolean on = false;
              try {
                String s = Settings.Secure.getString(getContext().getContentResolver(), Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                on = s != null && s.contains(getContext().getPackageName()) && s.contains("SendService");
              } catch (Throwable t) { }
              JSObject r = new JSObject();
              r.put("enabled", on);
              call.resolve(r);
            }

            @PluginMethod
            public void accessSettings(PluginCall call) {
              try {
                Intent i = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(i);
              } catch (Throwable t) { }
              call.resolve();
            }

            @PluginMethod
            public void batterySettings(PluginCall call) {
              try {
                Intent i = new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(i);
              } catch (Throwable t) { }
              call.resolve();
            }

            @PluginMethod
            public void setBrain(PluginCall call) {
              android.content.SharedPreferences.Editor e = getContext().getSharedPreferences("aura", Context.MODE_PRIVATE).edit();
              String[] ks = new String[] { "gk", "qk", "dev", "uname", "rules" };
              for (String k : ks) e.putString(k, call.getString(k, ""));
              e.putBoolean("bg", call.getBoolean("bg", true));
              e.apply();
              call.resolve();
            }

            private static String settingsAction(String k) {
              if ("wifi".equals(k)) return "android.settings.WIFI_SETTINGS";
              if ("bluetooth".equals(k)) return "android.settings.BLUETOOTH_SETTINGS";
              if ("display".equals(k)) return "android.settings.DISPLAY_SETTINGS";
              if ("sound".equals(k)) return "android.settings.SOUND_SETTINGS";
              if ("battery".equals(k)) return "android.intent.action.POWER_USAGE_SUMMARY";
              if ("location".equals(k)) return "android.settings.LOCATION_SOURCE_SETTINGS";
              if ("airplane".equals(k)) return "android.settings.AIRPLANE_MODE_SETTINGS";
              if ("data".equals(k)) return "android.settings.DATA_ROAMING_SETTINGS";
              if ("apps".equals(k)) return "android.settings.APPLICATION_SETTINGS";
              if ("storage".equals(k)) return "android.settings.INTERNAL_STORAGE_SETTINGS";
              if ("security".equals(k)) return "android.settings.SECURITY_SETTINGS";
              if ("accessibility".equals(k)) return "android.settings.ACCESSIBILITY_SETTINGS";
              if ("developer".equals(k)) return "android.settings.APPLICATION_DEVELOPMENT_SETTINGS";
              if ("date".equals(k)) return "android.settings.DATE_SETTINGS";
              if ("language".equals(k)) return "android.settings.LOCALE_SETTINGS";
              if ("nfc".equals(k)) return "android.settings.NFC_SETTINGS";
              if ("vpn".equals(k)) return "android.settings.VPN_SETTINGS";
              if ("privacy".equals(k)) return "android.settings.PRIVACY_SETTINGS";
              if ("about".equals(k)) return "android.settings.DEVICE_INFO_SETTINGS";
              if ("cast".equals(k)) return "android.settings.CAST_SETTINGS";
              if ("keyboard".equals(k)) return "android.settings.INPUT_METHOD_SETTINGS";
              if ("hotspot".equals(k)) return "android.settings.WIRELESS_SETTINGS";
              return "android.settings.SETTINGS";
            }

            @PluginMethod
            public void openSettings(PluginCall call) {
              String k = call.getString("page", "main");
              Context c = getContext();
              try {
                Intent i = new Intent(settingsAction(k));
                if ("hotspot".equals(k)) i.setClassName("com.android.settings", "com.android.settings.TetherSettings");
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                  c.startActivity(i);
                } catch (Throwable e1) {
                  Intent f = new Intent(settingsAction("hotspot".equals(k) ? "hotspot" : k));
                  f.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                    c.startActivity(f);
                  } catch (Throwable e2) {
                    Intent g = new Intent("android.settings.SETTINGS");
                    g.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                    c.startActivity(g);
                  }
                }
                call.resolve();
              } catch (Throwable t) {
                call.reject("settings nahi khuli: " + t.getMessage());
              }
            }

            @PluginMethod
            public void autoRun(PluginCall call) {
              String pkg = call.getString("package");
              if (pkg == null || pkg.length() == 0) { call.reject("package missing"); return; }
              String lp = pkg.toLowerCase();
              String[] bl = new String[] { "paisa", "phonepe", "paytm", "bhim", "upi", "bank", "wallet", "razorpay", "cred.club", "payment", "pay" };
              for (String b : bl) {
                if (lp.contains(b)) { call.reject("Payment ya bank app mein Aura kuch nahi karti."); return; }
              }
              Context c = getContext();
              Intent i = c.getPackageManager().getLaunchIntentForPackage(pkg);
              if (i == null) { call.reject("app launch nahi ho sakta"); return; }
              c.getSharedPreferences("aura", Context.MODE_PRIVATE).edit()
                .putString("auto_pkg", pkg)
                .putString("auto_mode", call.getString("mode", "search"))
                .putString("auto_q", call.getString("q", ""))
                .putString("auto_msg", call.getString("msg", ""))
                .putInt("auto_stage", 0)
                .putInt("auto_tries", 0)
                .putLong("auto_until", System.currentTimeMillis() + 45000).apply();
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              c.startActivity(i);
              call.resolve();
            }
          }
          EOF
          cat > $D/MainActivity.java << 'EOF'
          package com.divyanshu.aura;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(AuraNativePlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
          cat > $D/WakeService.java << 'EOF'
          package com.divyanshu.aura;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.SearchManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.content.pm.ServiceInfo;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.view.KeyEvent;
          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class WakeService extends Service {
            private static final String CH = "aura_wake";
            private final Handler h = new Handler(Looper.getMainLooper());
            private SpeechRecognizer sr;
            private AudioManager am;
            private boolean fg = false;
            private boolean muted = false;
            private boolean alive = true;
            private boolean session = false;
            private boolean after = false;
            private boolean ttsReady = false;
            private int empty = 0;
            private long lastWake = 0;
            private String pendingText = null;
            private TextToSpeech tts;
            private final ArrayList<String> hist = new ArrayList<String>();
            private String[] phrases = new String[] { "hey aura" };

            @Override
            public IBinder onBind(Intent intent) { return null; }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
              String a = intent != null ? intent.getAction() : null;
              if ("STOP".equals(a)) {
                alive = false;
                session = false;
                stopListen();
                stopTts();
                mute(false);
                try { stopForeground(true); } catch (Throwable t) { }
                stopSelf();
                return START_NOT_STICKY;
              }
              try {
                startFg();
              } catch (Throwable t) {
                alive = false;
                stopSelf();
                return START_NOT_STICKY;
              }
              loadPhrases();
              if ("FG".equals(a)) {
                fg = true;
                session = false;
                stopListen();
                stopTts();
                mute(false);
              } else if ("BG".equals(a)) {
                fg = false;
                if (!session) listenSoon(400);
              } else {
                if (!session) listenSoon(400);
              }
              return START_STICKY;
            }

            private SharedPreferences sp() { return getSharedPreferences("aura", Context.MODE_PRIVATE); }

            private void loadPhrases() {
              try {
                String s = sp().getString("phrases", "hey aura");
                if (s != null && s.length() > 0) phrases = s.split("\\|");
              } catch (Throwable t) { }
            }

            private void startFg() {
              NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
              if (Build.VERSION.SDK_INT >= 26) {
                nm.createNotificationChannel(new NotificationChannel(CH, "Aura Hey Aura", NotificationManager.IMPORTANCE_LOW));
              }
              Intent open = getPackageManager().getLaunchIntentForPackage(getPackageName());
              PendingIntent pi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, CH) : new Notification.Builder(this);
              b.setContentTitle("Aura sun rahi hai");
              b.setContentText("Hey Aura bolo");
              b.setSmallIcon(android.R.drawable.ic_btn_speak_now);
              b.setContentIntent(pi);
              b.setOngoing(true);
              Notification n = b.build();
              if (Build.VERSION.SDK_INT >= 30) startForeground(77, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
              else startForeground(77, n);
            }

            private final Runnable listenR = new Runnable() {
              public void run() { if (alive && !fg && !session) startListen(); }
            };

            private void listenSoon(long ms) {
              h.removeCallbacks(listenR);
              h.postDelayed(listenR, ms);
            }

            // ---------- wake word listening ----------
            private void startListen() {
              try {
                if (!SpeechRecognizer.isRecognitionAvailable(this)) return;
                stopListen();
                mute(true);
                sr = SpeechRecognizer.createSpeechRecognizer(this);
                sr.setRecognitionListener(new RecognitionListener() {
                  public void onReadyForSpeech(Bundle p) { }
                  public void onBeginningOfSpeech() { }
                  public void onRmsChanged(float v) { }
                  public void onBufferReceived(byte[] b) { }
                  public void onEndOfSpeech() { }
                  public void onError(int e) {
                    if (session) return;
                    if (e == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) { alive = false; stopSelf(); }
                    else if (e == SpeechRecognizer.ERROR_RECOGNIZER_BUSY) listenSoon(2000);
                    else listenSoon(700);
                  }
                  public void onResults(Bundle r) { if (!session && !check(r)) listenSoon(300); }
                  public void onPartialResults(Bundle r) { if (!session) check(r); }
                  public void onEvent(int t, Bundle b) { }
                });
                Intent it = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                it.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                it.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN");
                it.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                it.putExtra(RecognizerIntent.EXTRA_PREFER_OFFLINE, true);
                sr.startListening(it);
              } catch (Throwable t) {
                listenSoon(3000);
              }
            }

            private void stopListen() {
              try {
                if (sr != null) {
                  sr.cancel();
                  sr.destroy();
                }
              } catch (Throwable t) { }
              sr = null;
            }

            private void mute(boolean m) {
              try {
                if (am == null) am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                if (m && !muted) {
                  am.adjustStreamVolume(AudioManager.STREAM_NOTIFICATION, AudioManager.ADJUST_MUTE, 0);
                  muted = true;
                } else if (!m && muted) {
                  am.adjustStreamVolume(AudioManager.STREAM_NOTIFICATION, AudioManager.ADJUST_UNMUTE, 0);
                  muted = false;
                }
              } catch (Throwable t) { }
            }

            private static String norm(String s) {
              if (s == null) return "";
              return s.toLowerCase().replaceAll("[^\\p{L}\\p{M}\\p{N} ]", " ").replaceAll("\\s+", " ").trim();
            }

            private boolean check(Bundle r) {
              if (r == null) return false;
              ArrayList<String> l = r.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
              if (l == null) return false;
              for (String s : l) {
                String n = norm(s);
                for (String p : phrases) {
                  String q = norm(p);
                  if (q.length() > 2 && n.contains(q)) {
                    onWake();
                    return true;
                  }
                }
              }
              return false;
            }

            private void onWake() {
              long now = System.currentTimeMillis();
              if (now - lastWake < 6000) return;
              lastWake = now;
              stopListen();
              boolean bg = sp().getBoolean("bg", true);
              boolean hasKey = sp().getString("gk", "").length() > 5 || sp().getString("qk", "").length() > 5;
              if (bg && hasKey) {
                session = true;
                empty = 0;
                mute(false);
                speak("Haan, boliye.", true);
              } else {
                mute(false);
                launchAura();
                h.postDelayed(new Runnable() {
                  public void run() { if (alive && !fg && !session) listenSoon(200); }
                }, 15000);
              }
            }

            private void launchAura() {
              try {
                Intent i = new Intent();
                i.setClassName(getPackageName(), getPackageName() + ".MainActivity");
                i.setAction("aura.WAKE");
                i.putExtra("aura_wake", true);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                startActivity(i);
              } catch (Throwable t) { }
            }

            // ---------- background voice session ----------
            private final Runnable afterSpeak = new Runnable() {
              public void run() {
                if (!alive || !session) return;
                if (after) listenCmd(); else endSession();
              }
            };

            private void endSession() {
              session = false;
              stopListen();
              stopTts();
              mute(false);
              hist.clear();
              if (alive && !fg) listenSoon(900);
            }

            private void stopTts() {
              try { if (tts != null) tts.stop(); } catch (Throwable t) { }
            }

            private void speak(String t, boolean thenListen) {
              after = thenListen;
              pendingText = t;
              if (tts == null) {
                try {
                  tts = new TextToSpeech(getApplicationContext(), new TextToSpeech.OnInitListener() {
                    public void onInit(int status) {
                      ttsReady = status == TextToSpeech.SUCCESS;
                      if (ttsReady) {
                        try {
                          tts.setLanguage(new Locale("en", "IN"));
                          tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                            public void onStart(String id) { }
                            public void onDone(String id) { h.post(afterSpeak); }
                            public void onError(String id) { h.post(afterSpeak); }
                          });
                        } catch (Throwable e) { ttsReady = false; }
                      }
                      h.post(new Runnable() { public void run() { flushSpeak(); } });
                    }
                  });
                } catch (Throwable e) {
                  ttsReady = false;
                  h.post(afterSpeak);
                }
              } else if (ttsReady) {
                flushSpeak();
              }
            }

            private void flushSpeak() {
              String t = pendingText;
              pendingText = null;
              if (t == null) return;
              if (!ttsReady || tts == null) { h.post(afterSpeak); return; }
              try {
                tts.speak(t, TextToSpeech.QUEUE_FLUSH, new Bundle(), "aura");
              } catch (Throwable e) {
                h.post(afterSpeak);
              }
            }

            private void listenCmd() {
              try {
                stopListen();
                mute(true);
                sr = SpeechRecognizer.createSpeechRecognizer(this);
                sr.setRecognitionListener(new RecognitionListener() {
                  public void onReadyForSpeech(Bundle p) { }
                  public void onBeginningOfSpeech() { }
                  public void onRmsChanged(float v) { }
                  public void onBufferReceived(byte[] b) { }
                  public void onEndOfSpeech() { }
                  public void onPartialResults(Bundle r) { }
                  public void onEvent(int t, Bundle b) { }
                  public void onError(int e) {
                    if (!session) return;
                    if (e == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) { endSession(); return; }
                    emptyTurn();
                  }
                  public void onResults(Bundle r) {
                    if (!session) return;
                    ArrayList<String> l = r == null ? null : r.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                    if (l == null || l.size() == 0 || l.get(0).trim().length() == 0) { emptyTurn(); return; }
                    empty = 0;
                    handleCmd(l.get(0).trim());
                  }
                });
                Intent it = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                it.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                it.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN");
                it.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1);
                sr.startListening(it);
              } catch (Throwable t) {
                endSession();
              }
            }

            private void emptyTurn() {
              empty++;
              if (empty >= 2) {
                endSession();
              } else {
                h.postDelayed(new Runnable() { public void run() { if (alive && session) listenCmd(); } }, 400);
              }
            }

            private void handleCmd(String raw) {
              String n = norm(raw);
              if (n.matches("(bas|bas itna|band karo|band kar do|bye|ok bye|alvida|shukriya|dhanyavad|thank you|thanks|that s all)")) {
                speak("Theek hai. Jab chahiye Hey Aura bolna.", false);
                return;
              }
              int key = mediaKey(n);
              if (key != 0) {
                sendKey(key);
                speak("Ho gaya.", false);
                return;
              }
              if (n.matches("(aura |app )?(me|mein|men) (le chalo|chalo|aao|aa jao|wapas aao)|(aura |app )?wapas (chalo|aao)")) {
                speak("Aura khol rahi hoon.", false);
                h.postDelayed(new Runnable() { public void run() { openSelf(); } }, 900);
                return;
              }
              String song = songQuery(n);
              if (song != null) {
                boolean played = playSong(song);
                speak(played ? "Gana chala rahi hoon." : "YouTube par dhoondh rahi hoon.", false);
                return;
              }
              String sk = settingsKey(n);
              if (sk != null) {
                openSettingsPage(sk);
                speak("Settings khol rahi hoon.", false);
                return;
              }
              Matcher sm = Pattern.compile("(?:aura )?(.+?) (?:me|mein|men|par|pe) (.{2,}?) (?:search karo|search kar do|search|dhundo|dhoondo|dhundh do|khojo)").matcher(n);
              if (!sm.matches()) sm = Pattern.compile("(?:aura )?(.+?) (?:me|mein|men|par|pe) search (?:karo|kar do) (.{2,})").matcher(n);
              if (sm.matches()) {
                speak(appSearch(sm.group(1).trim(), sm.group(2).trim()), false);
                return;
              }
              String app = appName(n);
              if (app != null) {
                String label = openByName(app);
                if (label != null) speak(label + " khol rahi hoon.", false);
                else speak(app + " naam ka app mujhe nahi mila.", true);
                return;
              }
              if (n.matches(".*\\b(yaad|remind|reminder|note|todo|whatsapp|message|sms|call|delete|mitao|bhejo|bhej do|payment|pay)\\b.*")) {
                speak("Ye kaam confirm karke hota hai, isliye Aura app khol rahi hoon.", false);
                h.postDelayed(new Runnable() { public void run() { launchAura(); } }, 1500);
                return;
              }
              askAi(raw);
            }

            // ---------- local commands ----------
            private int mediaKey(String n) {
              String w = "(?:music|gana|song|video|track)";
              if (n.matches("(?:aura )?(?:" + w + " )?(?:pause|roko|ruko|rok do)(?: " + w + ")?(?: kar(?:o| do|do))?") || n.matches(w + " (?:band|stop)(?: kar(?:o| do|do))?")) return KeyEvent.KEYCODE_MEDIA_PAUSE;
              if (n.matches("(?:aura )?(?:" + w + " )?(?:play|resume|chalao|chala do|chalu karo|chalu kar do|shuru karo)(?: " + w + ")?(?: kar(?:o| do|do))?")) return KeyEvent.KEYCODE_MEDIA_PLAY;
              if (n.matches("(?:aura )?(?:next|agla|agle|skip)(?: " + w + ")?(?: (?:lagao|chalao|karo|kar do))?")) return KeyEvent.KEYCODE_MEDIA_NEXT;
              if (n.matches("(?:aura )?(?:previous|prev|pichla|pichle)(?: " + w + ")?(?: (?:lagao|chalao|karo|kar do))?")) return KeyEvent.KEYCODE_MEDIA_PREVIOUS;
              return 0;
            }

            private void sendKey(int code) {
              try {
                if (am == null) am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, code));
                am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, code));
              } catch (Throwable t) { }
            }

            private String songQuery(String n) {
              String[] pats = new String[] {
                "(?:aura )?play (.{2,})",
                "(?:aura )?(.{2,}?) (?:gana|song|music) (?:play|bajao|chalao|laga|lagao)(?: kar(?:o)?| do)?",
                "(?:aura )?(.{2,}?) (?:play kar(?:o)?|play kar do|bajao|bajana)"
              };
              for (String p : pats) {
                Matcher m = Pattern.compile(p).matcher(n);
                if (m.matches()) {
                  String q = m.group(1).replaceAll("\\s+(ka|ki|ke|ka koi)$", "").trim();
                  if (q.length() > 1 && !q.matches("(music|gana|song|video|track|youtube|spotify|karo|kar do)")) return q;
                }
              }
              return null;
            }

            private boolean playSong(String q) {
              String[] pk = new String[] { "com.google.android.apps.youtube.music", "com.spotify.music" };
              for (String p : pk) {
                try {
                  Intent i = new Intent(MediaStore.INTENT_ACTION_MEDIA_PLAY_FROM_SEARCH);
                  i.setPackage(p);
                  i.putExtra(MediaStore.EXTRA_MEDIA_FOCUS, "vnd.android.cursor.item/*");
                  i.putExtra(SearchManager.QUERY, q);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  if (i.resolveActivity(getPackageManager()) != null) {
                    startActivity(i);
                    return true;
                  }
                } catch (Throwable t) { }
              }
              try {
                sp().edit().putLong("play_until", System.currentTimeMillis() + 25000).apply();
                Intent v = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/results?search_query=" + Uri.encode(q)));
                v.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                  v.setPackage("com.google.android.youtube");
                  startActivity(v);
                } catch (Throwable e) {
                  v.setPackage(null);
                  startActivity(v);
                }
              } catch (Throwable t) { }
              return false;
            }

            private String appName(String n) {
              Matcher m = Pattern.compile("(?:open )?(.+?) (?:kholo|khol do|kholna|open karo|open kar do|\u0916\u094b\u0932\u094b|\u0916\u094b\u0932 \u0926\u094b)").matcher(n);
              if (m.matches()) return m.group(1).trim();
              m = Pattern.compile("(?:open|kholo|\u0913\u092a\u0928) (.+)").matcher(n);
              if (m.matches()) return m.group(1).trim();
              return null;
            }

            private static String alias(String q) {
              String[][] a = new String[][] {
                { "insta", "instagram" }, { "yt", "youtube" }, { "yutube", "youtube" }, { "utube", "youtube" }, { "u tube", "youtube" },
                { "whatsap", "whatsapp" }, { "watsapp", "whatsapp" }, { "whats app", "whatsapp" }, { "fb", "facebook" }, { "snap", "snapchat" },
                { "यूट्यूब", "youtube" }, { "व्हाट्सएप", "whatsapp" },
                { "इंस्टाग्राम", "instagram" }, { "फेसबुक", "facebook" },
