            private static int lev(String a, String b) {
              int[] p = new int[b.length() + 1];
              for (int j = 0; j <= b.length(); j++) p[j] = j;
              for (int i = 1; i <= a.length(); i++) {
                int[] c = new int[b.length() + 1];
                c[0] = i;
                for (int j = 1; j <= b.length(); j++) {
                  int cost = a.charAt(i - 1) == b.charAt(j - 1) ? 0 : 1;
                  c[j] = Math.min(Math.min(c[j - 1] + 1, p[j] + 1), p[j - 1] + cost);
                }
                p = c;
              }
              return p[b.length()];
            }

            private String[] findPkg(String q0) {
              try {
                String q = alias(norm(q0)).replace(" ", "");
                if (q.length() == 0) return null;
                PackageManager pm = getPackageManager();
                Intent main = new Intent(Intent.ACTION_MAIN, null);
                main.addCategory(Intent.CATEGORY_LAUNCHER);
                List<ResolveInfo> list = pm.queryIntentActivities(main, 0);
                String bestPkg = null;
                String bestLabel = null;
                double best = 0;
                for (ResolveInfo ri : list) {
                  String label = ri.loadLabel(pm).toString();
                  String ln = norm(label).replace(" ", "");
                  if (ln.length() == 0) continue;
                  double sc = 0;
                  if (ln.equals(q)) sc = 100;
                  else if (ln.startsWith(q)) sc = 80;
                  else if (ln.contains(q)) sc = 60;
                  else if (ln.length() > 3 && q.contains(ln)) sc = 50;
                  else if (q.length() >= 4 && lev(ln, q) <= (q.length() >= 7 ? 2 : 1)) sc = 40;
                  if (sc > 0) {
                    sc -= ln.length() / 100.0;
                    if (sc > best) { best = sc; bestPkg = ri.activityInfo.packageName; bestLabel = label; }
                  }
                }
                if (bestPkg == null) return null;
                return new String[] { bestPkg, bestLabel };
              } catch (Throwable t) {
                return null;
              }
            }

