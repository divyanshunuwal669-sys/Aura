            private static void loop(Context ctx, String goal) {
              SharedPreferences sp = ctx.getSharedPreferences("aura", Context.MODE_PRIVATE);
              ArrayList<String> hist = new ArrayList<String>();
              note(ctx, "Aura kaam kar rahi hai", goal + " | shuru", true);
              int step = 0;
